<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>아이돌 체험</title>
<style>
/* Layout: native-messenger column — top bar · chat (fans left with avatar, me right in my color) · input bar with + tray. Settings and letters open as full pages; item actions use bottom action sheets. */
:root{
  --accent:#ff4f86;
  --on-accent:#ffffff;
  --accent-ink:color-mix(in oklab, var(--accent) 80%, #141416);
  --chat:#f2f3f5;
  --bar:#ffffff;
  --surface:#ffffff;
  --page:#f2f2f6;
  --ink:#141416;
  --muted:#8b8c95;
  --line:#e3e4e9;
  --seg:#e9e9ee;
  --seg-on:#ffffff;
  --stage:#e4e5ea;
  --danger:#e5484d;
  --av-bg:86%;
  --sil:#b4b6be;
  --shadow:0 4px 16px rgba(0,0,0,.12);
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent-ink:color-mix(in oklab, var(--accent) 72%, #ffffff);
    --chat:#0e0e10;
    --bar:#18181b;
    --surface:#26262b;
    --page:#0e0e10;
    --ink:#f2f2f5;
    --muted:#8f909a;
    --line:#2c2c32;
    --seg:#2a2a30;
    --seg-on:#4a4a53;
    --stage:#050506;
    --danger:#ff6369;
    --av-bg:30%;
    --sil:#5c5d66;
    --shadow:0 4px 16px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent-ink:color-mix(in oklab, var(--accent) 72%, #ffffff);
  --chat:#0e0e10;
  --bar:#18181b;
  --surface:#26262b;
  --page:#0e0e10;
  --ink:#f2f2f5;
  --muted:#8f909a;
  --line:#2c2c32;
  --seg:#2a2a30;
  --seg-on:#4a4a53;
  --stage:#050506;
  --danger:#ff6369;
  --av-bg:30%;
  --sil:#5c5d66;
  --shadow:0 4px 16px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;background:var(--bar);color:var(--ink);font-family:var(--f);font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
@media (min-width:600px){body{background:var(--stage)}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:480px;margin-inline:auto;display:flex;flex-direction:column;background:var(--chat);overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line)}}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:10px;height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--line)}
.me-face{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px}
.me-face img,.face img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.nm{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin-top:1px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ibtn{position:relative;flex:none;width:40px;height:40px;margin-right:-6px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.ibtn svg{width:24px;height:24px}
.badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* chat */
.stream{position:relative;flex:1;min-height:0;display:flex}
.list{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.day{align-self:center;margin-block:6px 2px;padding:4px 12px;border-radius:999px;background:color-mix(in oklab,var(--ink) 6%,transparent);font-size:12px;color:var(--muted)}
.sys{align-self:center;max-width:88%;padding:7px 12px;border-radius:12px;background:color-mix(in oklab,var(--ink) 5%,transparent);text-align:center;font-size:12.5px;line-height:1.5;color:var(--muted)}
.row{animation:pop .2s ease-out}
.row.still{animation:none}
@keyframes pop{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
.fan{min-width:0}
.fname{margin:0 0 4px 2px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname span{cursor:pointer}
.fline{display:flex;align-items:flex-end;gap:5px;min-width:0}
.fb{min-width:0;max-width:calc(100% - 54px);padding:8px 12px;border-radius:4px 16px 16px 16px;background:var(--surface);font-size:15px;line-height:1.45;overflow-wrap:anywhere;cursor:pointer}
.fb:active{filter:brightness(.95)}
.tm{flex:none;padding-bottom:1px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.me{display:flex;justify-content:flex-end;align-items:flex-end;gap:5px}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-bottom:1px;cursor:pointer}
.rc{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.rc svg{width:11px;height:11px}
.stack{min-width:0;max-width:76%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ib{max-width:100%;padding:8px 12px;border-radius:16px 4px 16px 16px;background:var(--accent);color:var(--on-accent);font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}
.ib:active{filter:brightness(.95)}
.ib.vb{padding:6px 12px 6px 6px}
.tx{display:block}
.vb .tx{padding:6px 0 2px 6px}
.pic{display:block;width:100%;max-width:240px;max-height:320px;object-fit:cover;border-radius:14px;background:var(--seg);cursor:zoom-in}
video.pic{object-fit:contain;background:#000;cursor:auto}
.qt{display:block;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid color-mix(in oklab,var(--on-accent) 30%,transparent);font-size:12.5px;line-height:1.4;white-space:normal}
.qt b{display:block;font-size:12px;font-weight:600;opacity:.9}
.qt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.chip{display:inline-block;padding:0 6px;margin:0 1px;border-radius:6px;background:color-mix(in oklab,var(--on-accent) 24%,transparent);font-size:.92em;font-weight:600;white-space:nowrap}
.voice{display:flex;align-items:center;gap:9px;min-width:190px}
.play{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:var(--on-accent);color:var(--accent);display:grid;place-items:center}
.play svg{width:16px;height:16px}
.bars{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.bars i{display:block;width:3px;border-radius:2px;background:color-mix(in oklab,var(--on-accent) 42%,transparent)}
.bars i.on{background:var(--on-accent)}
.vdur{font-size:12px;font-variant-numeric:tabular-nums;opacity:.9}
.gone{display:block;padding:10px 12px;border-radius:14px;background:var(--seg);font-size:13px;color:var(--muted)}
.newpill{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;padding:8px 14px;border:0;border-radius:999px;background:var(--bar);color:var(--accent-ink);font-size:13px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}

/* input bar */
.composer{flex:none;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-top:1px solid var(--line)}
.inrow{display:flex;align-items:flex-end;gap:8px}
.plus{flex:none;width:36px;height:36px;margin:0 0 3px -6px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;transition:transform .15s}
.plus svg{width:26px;height:26px}
.plus[aria-expanded="true"]{transform:rotate(45deg);color:var(--ink)}
.field{flex:1;min-width:0;display:flex;border-radius:20px;background:var(--seg)}
#msg{flex:1;min-width:0;height:42px;max-height:124px;padding:10px 14px;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.35}
#msg::placeholder{color:var(--muted)}
.send{flex:none;width:36px;height:36px;margin-bottom:3px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.send svg{width:19px;height:19px}
.send:disabled{background:var(--seg);color:var(--muted);cursor:default}
.tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px;padding:16px 0 8px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}
.tile i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--seg)}
.tile i svg{width:24px;height:24px}
.qbar,.attach{display:flex;align-items:center;gap:10px;margin-bottom:7px;padding:7px 7px 7px 12px;border-radius:12px;background:var(--seg);font-size:12.5px}
.qtxt{flex:1;min-width:0}
.qtxt b{display:block;font-size:12px;font-weight:600;color:var(--accent-ink)}
.qtxt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.attach img,.attach video{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover}
.attach .wv{flex:none;width:44px;height:44px;border-radius:8px;background:var(--bar);display:grid;place-items:center}
.attach .wv svg{width:20px;height:20px}
.x{flex:none;width:28px;height:28px;border:0;border-radius:50%;background:var(--bar);display:grid;place-items:center}
.x svg{width:14px;height:14px}

/* action sheet */
.as-wrap{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .18s}
.as{position:relative;display:flex;flex-direction:column;gap:8px;padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s cubic-bezier(.2,.9,.3,1)}
.as-g{border-radius:14px;overflow:hidden;background:var(--bar)}
.as-h{padding:13px 16px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
.as-h b{display:block;font-weight:600}
.as-h span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.as-b{display:block;width:100%;height:54px;border:0;border-top:1px solid var(--line);background:none;font-size:17px}
.as-g>.as-b:first-child,.as-h+.as-b{border-top:0}
.as-b.red{color:var(--danger)}
.as-b.cancel{font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* pages */
.page{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--page);animation:slide .22s ease-out}
.page.noanim{animation:none}
@keyframes slide{from{transform:translateX(28px);opacity:.4}}
.ph{flex:none;height:52px;display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--line)}
.ph h2{margin:0;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl,.pr{height:44px;padding:0;border:0;background:none;display:flex;align-items:center;font-size:16px}
.pl svg{width:26px;height:26px;margin-left:-7px}
.pr{justify-content:flex-end;font-weight:600;color:var(--accent-ink)}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pfoot{flex:none;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--page)}
.intro{margin:14px 4px 0;font-size:14px;line-height:1.55;color:var(--muted);text-align:center}
.glabel{margin:22px 4px 7px;font-size:13px;color:var(--muted)}
.gnote{margin:7px 4px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.gnote.warn{color:var(--danger)}
.cells{border-radius:12px;overflow:hidden;background:var(--surface)}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:16px}
.cells>.cell:first-child{border-top:0}
.ck{flex:none;width:68px}
.cv{flex:1;min-width:0;height:48px;border:0;background:none;outline:none;font-size:16px}
.cv::placeholder{color:var(--muted)}
.grow{flex:1;min-width:0}
.val{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.cell.red{color:var(--danger)}
.mini{flex:none;padding:6px 11px;border:0;border-radius:999px;background:var(--seg);font-size:13px}
.avwrap{display:flex;justify-content:center;padding-top:18px}
.avbig{position:relative;width:96px;height:96px;cursor:pointer}
.face{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:36px;font-weight:700}
.cam{position:absolute;right:0;bottom:0;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line),var(--shadow)}
.cam svg{width:16px;height:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:2px;border-radius:10px;background:var(--seg)}
.seg label{position:relative;display:block}
.seg input,.sw input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;place-items:center;height:34px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.seg input:checked+span{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.sw{display:flex;flex-wrap:wrap;gap:12px;padding:13px 16px}
.sw label{position:relative;display:block}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);cursor:pointer}
.sw input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.custom{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;cursor:pointer;background:conic-gradient(#ff4f6d,#ffb300,#4cd964,#2ec5ff,#7b61ff,#ff4f6d)}
.custom.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.custom input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
.toggle{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:50px;height:30px;margin:0;border-radius:15px;background:var(--seg);cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(20px)}
.btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16.5px;font-weight:600}
.lcell{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.cells>.lcell:first-child{border-top:0}
.lmain{flex:1;min-width:0}
.ln{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.lcell.new .ln::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--danger)}
.lp{margin-top:2px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldate{flex:none;align-self:flex-start;margin-top:2px;font-size:12px;color:var(--muted)}
.lhead{display:flex;align-items:center;gap:12px;margin:16px 4px 12px}
.lhead b{display:block;font-size:15px}
.lhead span{font-size:12.5px;color:var(--muted)}
.lcard{padding:20px 18px;border-radius:14px;background:var(--surface);font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{padding:40px 0;text-align:center;font-size:14px;color:var(--muted)}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:rgba(32,32,36,.92);color:#fff;font-size:13.5px;text-align:center}
.lb{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.92);cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="me-face" id="hFace"></div>
    <div class="who">
      <div class="nm" id="hName">하린</div>
      <div class="sub" id="hSub">구독자</div>
    </div>
    <button class="ibtn" id="bLetters" type="button" aria-label="편지함">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
      <span class="badge" id="lBadge" hidden>0</span>
    </button>
    <button class="ibtn" id="bSettings" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <div class="stream">
    <main class="list" id="list" role="log" aria-live="off" aria-label="채팅"></main>
    <button class="newpill" id="newpill" type="button" hidden>새 답장 <b id="newN">0</b>개 ↓</button>
  </div>

  <footer class="composer">
    <div class="qbar" id="qbar" hidden></div>
    <div class="attach" id="attach" hidden></div>
    <div class="inrow">
      <button class="plus" id="bPlus" type="button" aria-label="첨부" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="field"><textarea id="msg" rows="1" placeholder="메시지 입력" aria-label="메시지"></textarea></div>
      <button class="send" id="send" type="button" aria-label="보내기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <div class="tray" id="tray" hidden>
      <button class="tile" type="button" id="tAlbum"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></i>앨범</button>
      <button class="tile" type="button" id="tVoice"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></i>음성</button>
      <button class="tile" type="button" id="tName"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-7 8-7s7 2.5 8 7"/></svg></i>팬 이름</button>

    nick: fan.nick, qn: (ctx && ctx.quote && ctx.quote.nick) || '답장 받은 분',

    jp: n + (cfg.gender === 'm' ? 'くん' : 'ちゃん'), jpk: cfg.gender === 'm' ? 'かっこよすぎる' : 'かわいすぎる'

      default: return w + p;
    }
  });
}

function lum(hex) {
  let v = String(hex || '#ff4f86').replace('#', '');
  if (v.length === 3) v = v.split('').map(x => x + x).join('');
  const ch = [0, 2, 4].map(i => parseInt(v.substr(i, 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4));
  return .2126 * ch[0] + .7152 * ch[1] + .0722 * ch[2];
}
function setAccent(c) {
  c = c || cfg.color;
  const L = lum(c);
  const root = document.documentElement;
  root.style.setProperty('--accent', c);
  root.style.setProperty('--on-accent', 1.05 / (L + .05) >= (L + .05) / .061 ? '#ffffff' : '#1b1a1d');
}

  const times = [];

  times.sort((a, b) => a - b);

  const target = Math.max(N, Math.round((meta.subs || 1000) * (S.rate[0] + R() * (S.rate[1] - S.rate[0]))));

}

  }

function tick() {
  const now = performance.now();

    const e = now - job.start;

    const e2 = Math.max(0, e - 400);
    const F = Math.min(1, (1 - Math.exp(-e2 / job.tau)) / job.norm);
    const c = Math.round(job.target * F);
    if (c !== job.m.count) { job.m.count = c; updateCount(job.m); }
    if (job.i >= job.times.length && e > job.dur + 2500) { job.m.count = job.target; updateCount(job.m); job.done = true; saveSoon(); }
  }
  if (jobs.some(j => j.done)) jobs = jobs.filter(j => !j.done);
  if (!cfg.debuted) return;
  if (jobs.length) nextIdle = now + 5000;
  else if (!document.hidden && now >= nextIdle) {
    const S = SCALE[cfg.scale];
    if (now - idleAntiAt > 90000) { idleAnti = rollAnti(); idleAntiAt = now; }
    if (nextIdle) {
      const fan = pickFan(rollType(idleAnti)) || pickFan('adultF');
      if (fan) emitFan(fan, fill((R() < .55 && lineFor('idle', fan)) || generic(fan), fan, null), null);
    }

}

    m.type = att.kind; m.media = 'm_' + m.id; if (att.dur) m.dur = att.dur;
    blob = att.blob; urlCache.set(m.media, att.url); media.put(m.media, blob);
  }
  if (quote) m.quote = { fid: quote.fid, nick: quote.nick, text: quote.text };
  const ctx = { cats: detectCats(text), media: m.type || null, name: text.includes(NAME_TOKEN), quote: quote ? Object.assign({}, quote) : null, anti: rollAnti(), ai: [] };
  idleAnti = ctx.anti; idleAntiAt = performance.now();
  msgs.push(m); append(m); saveSoon();
  ta.value = ''; autosize(); clearAttachment(false); clearQuote(); closeTray(); refreshSend();
  startJob(m, ctx);
  requestAI(m, ctx, blob);
}

/* ---------- profile fields ---------- */
function seg(name, opts, val) {
  return opts.map(([v, label]) => `<label><input type="radio" name="${name}" id="${name}-${v}" value="${v}"${v === val ? ' checked' : ''}><span>${label}</span></label>`).join('');
}
function profileHTML(p, c) {
  const known = COLORS.some(([h]) => h.toLowerCase() === String(c.color).toLowerCase());
  return `
  <div class="avwrap"><label class="avbig" for="${p}-av" aria-label="프로필 사진 바꾸기"><span class="face" id="${p}-face">${faceHTML(c)}</span><span class="cam">${ICON.cam}</span></label><input type="file" id="${p}-av" accept="image/*" hidden></div>
  <div class="glabel">기본 정보</div>
  <div class="cells">
    <label class="cell"><span class="ck">활동명</span><input class="cv" type="text" id="${p}-name" maxlength="12" value="${esc(c.name)}" placeholder="필수" autocomplete="off"></label>
    <label class="cell"><span class="ck">그룹명</span><input class="cv" type="text" id="${p}-group" maxlength="16" value="${esc(c.group)}" placeholder="솔로면 비워 두세요" autocomplete="off"></label>
    <label class="cell"><span class="ck">팬덤명</span><input class="cv" type="text" id="${p}-fandom" maxlength="10" value="${esc(c.fandom)}" placeholder="예: 루미" autocomplete="off"></label>
  </div>
  <div class="glabel">성별</div>
  <div class="seg">${seg(p + '-gender', [['f', '여자'], ['m', '남자']], c.gender)}</div>
  <div class="glabel">대표 색상</div>
  <div class="cells"><div class="sw">${COLORS.map(([h, nm]) => `<label title="${nm}"><input type="radio" name="${p}-sw" id="${p}-sw-${h.slice(1)}" value="${h}"${known && h.toLowerCase() === String(c.color).toLowerCase() ? ' checked' : ''} aria-label="${nm}"><span style="--c:${h}"></span></label>`).join('')}<label class="custom${known ? '' : ' on'}" id="${p}-custom" title="직접 고르기"><input type="color" id="${p}-color" value="${esc(c.color)}" aria-label="색 직접 고르기"></label></div></div>
  <div class="glabel">팬 규모</div>
  <div class="seg">${seg(p + '-scale', Object.entries(SCALE).map(([k, v]) => [k, v.label]), c.scale)}</div>
  <p class="gnote">신인은 구독자 수천 명, 대세는 수만 명, 월드스타는 100만 명 안팎이에요.</p>`;
}
function bindProfile(root, p, draft) {
  root.querySelector(`#${p}-av`).addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const b = await compress(f, 320, .86); draft.avatar = await toDataURL(b); } catch (err) { toast('이 사진은 쓸 수 없어요'); return; }
    root.querySelector(`#${p}-face`).innerHTML = faceHTML(draft);
  });
  const nameIn = root.querySelector(`#${p}-name`);
  nameIn.addEventListener('input', () => { draft.name = nameIn.value.trim(); if (!draft.avatar) root.querySelector(`#${p}-face`).innerHTML = faceHTML(draft); });
  const colorIn = root.querySelector(`#${p}-color`), custom = root.querySelector(`#${p}-custom`);
  root.querySelectorAll(`input[name="${p}-sw"]`).forEach(r => r.addEventListener('change', () => { colorIn.value = r.value; custom.classList.remove('on'); draft.color = r.value; setAccent(r.value); }));
  colorIn.addEventListener('input', () => {
    let hit = false;
    root.querySelectorAll(`input[name="${p}-sw"]`).forEach(r => { r.checked = r.value.toLowerCase() === colorIn.value.toLowerCase(); hit = hit || r.checked; });
    custom.classList.toggle('on', !hit);
    draft.color = colorIn.value; setAccent(colorIn.value);
  });
}
function readProfile(root, p, draft) {
  const v = id => root.querySelector(`#${p}-${id}`).value.trim();
  const r = name => { const el = root.querySelector(`input[name="${p}-${name}"]:checked`); return el ? el.value : null; };
  return { name: v('name'), group: v('group'), fandom: v('fandom'), gender: r('gender') || 'f', scale: r('scale') || 'mid', color: root.querySelector(`#${p}-color`).value || cfg.color, avatar: draft.avatar || null };
}

/* ---------- setup ---------- */
function showSetup() {
  const draft = Object.assign({}, cfg);
  openPage({
    title: '프로필 설정', anim: false,
    body: `<p class="intro">팬들에게 보이는 프로필이에요.<br>나중에 설정에서 바꿀 수 있어요.</p>${profileHTML('s', draft)}`,
    foot: '<button class="btn" type="button" id="s-go">시작하기</button>',
    bind: pg => {
      bindProfile(pg, 's', draft);
      const go = () => {
        const prof = readProfile(pg, 's', draft);
        if (!prof.name) { toast('활동명을 적어 주세요'); pg.querySelector('#s-name').focus(); return; }
        debut(prof);
      };
      pg.querySelector('#s-go').addEventListener('click', go);
      pg.querySelectorAll('.cv').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } }));
    }
  });
}
function seedChat() {
  const now = Date.now();
  msgs.push({ id: uid(), kind: 'sys', t: now - 60000, text: '채팅방이 열렸어요. 내 메시지는 모든 구독자에게 전달되고, 팬들의 답장은 나만 볼 수 있어요. 팬 프로필이나 말풍선을 누르면 답장하거나 차단할 수 있어요.' });
  const k = rint(4, 6);
  for (let i = 0; i < k; i++) {
    const fan = pickFan(rollType(idleAnti)) || pickFan('adultF'); if (!fan) continue;
    msgs.push({ id: uid(), kind: 'fan', t: now - (k - i) * rint(6000, 14000), fid: fan.fid, nick: fan.nick, days: fan.days, hue: fan.hue, av: fan.av, type: fan.type, text: fill((R() < .7 && lineFor('idle', fan)) || generic(fan), fan, null), to: null });
  }
}
function debut(prof) {
  const rescale = prof.scale !== cfg.scale || !meta.subs;
  Object.assign(cfg, prof, { debuted: true });
  setAccent(); buildPool();
  if (rescale) { const S = SCALE[cfg.scale]; meta.subs = rint(S.subs[0], S.subs[1]); }
  if (!msgs.length) seedChat();
  if (!letters.length) letters.push(makeLetter(), makeLetter());
  meta.nextLetter = Date.now() + rint(150000, 300000);
  nextIdle = 0;
  saveAll(); renderAll(); updateHeader(); updateBadge(); closePage();
}

/* ---------- settings ---------- */
function openSettings() {
  const draft = Object.assign({}, cfg);
  const aiWarn = aiState === 'none' ? ' 지금 화면에서는 쓸 수 없어서 기본 답장으로 나와요.' : aiState === 'denied' ? ' Claude 사용을 허락하지 않아서 기본 답장으로 나와요. 다시 열면 또 물어봐요.' : '';
  const cancel = () => { setAccent(cfg.color); closePage(); };
  openPage({
    title: '설정', back: cancel,
    right: { label: '완료', fn: () => { if (page._save) page._save(); } },
    body: `${profileHTML('p', draft)}
      ${aiState === 'none' ? '' : `<div class="glabel">답장</div>
      <div class="cells"><label class="cell" for="p-ai"><span class="grow">내용 맞춤 답장</span><input type="checkbox" class="toggle" id="p-ai"${cfg.ai ? ' checked' : ''}></label></div>
      <p class="gnote${aiWarn ? ' warn' : ''}">켜 두면 팬들이 내 글과 사진 내용을 보고 답장해요. 처음 보낼 때 Claude 사용을 허락할지 물어봐요.${aiWarn}</p>`}
      <div class="glabel">관리</div>
      <div class="cells">
        <div class="cell"><span class="grow">차단한 팬</span><span class="val" id="blkN">${blocked.size}명</span>${blocked.size ? '<button class="mini" type="button" id="p-unblock">모두 해제</button>' : ''}</div>
        <button class="cell red" type="button" id="p-clear">채팅 비우기</button>
        <button class="cell red" type="button" id="p-reset">처음부터 다시 시작</button>
      </div>`,
    bind: pg => {
      bindProfile(pg, 'p', draft);
      const ub = pg.querySelector('#p-unblock');
      if (ub) ub.addEventListener('click', () => { blocked.clear(); saveAll(); pg.querySelector('#blkN').textContent = '0명'; ub.remove(); toast('차단을 모두 풀었어요'); });
      pg.querySelector('#p-clear').addEventListener('click', () => openAction({
        title: '채팅을 모두 지울까요?', sub: '보낸 메시지와 팬 답장이 모두 사라져요.',
        actions: [{ label: '지우기', red: true, fn: () => {
          jobs = []; msgs = []; media.clear(); urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear();
          msgs.push({ id: uid(), kind: 'sys', t: Date.now(), text: '채팅을 비웠어요.' });
          saveAll(); renderAll(); cancel(); toast('채팅을 비웠어요');
        } }]
      }));
      pg.querySelector('#p-reset').addEventListener('click', () => openAction({
        title: '처음부터 다시 시작할까요?', sub: '채팅, 편지, 차단 목록이 모두 지워져요.',
        actions: [{ label: '다시 시작', red: true, fn: () => {
          jobs = []; msgs = []; letters = []; blocked.clear(); media.clear(); urlCache.clear();
          cfg.debuted = false; meta.subs = 0; saveAll(); renderAll(); updateBadge(); setAccent(cfg.color);
          showSetup();
        } }]
      }));
      function save() {
        const prof = readProfile(pg, 'p', draft);
        if (!prof.name) { toast('활동명을 적어 주세요'); pg.querySelector('#p-name').focus(); return; }
        const rebuild = prof.name !== cfg.name || prof.group !== cfg.group || prof.gender !== cfg.gender || prof.fandom !== cfg.fandom;
        const rescale = prof.scale !== cfg.scale;
        const aiEl = pg.querySelector('#p-ai');
        Object.assign(cfg, prof, { ai: aiEl ? aiEl.checked : cfg.ai });
        if (rebuild) { buildPool(); refreshNicks(); }
        if (rescale) { const S = SCALE[cfg.scale]; meta.subs = rint(S.subs[0], S.subs[1]); }
        setAccent(); updateHeader(); saveAll(); closePage();
        if (rebuild) renderAll();
        toast('저장했어요');
      }
      pg._save = save;
    }
  });
}

$('#bLetters').addEventListener('click', openLetters);
$('#bSettings').addEventListener('click', openSettings);

/* ---------- boot ---------- */
function refreshNicks() {
  for (const m of msgs) if (m.kind === 'fan') { const f = byId.get(m.fid); if (f) m.nick = f.nick; }
  for (const l of letters) { const f = byId.get(l.fid); if (f) l.nick = f.nick; }
}
try { localStorage.removeItem('dh.pfps'); } catch (e) {}
setAccent(); buildPool(); refreshNicks();
if (cfg.debuted) {
  if (!meta.subs) { const S = SCALE[cfg.scale]; meta.subs = rint(S.subs[0], S.subs[1]); }
  renderAll();
} else {
  showSetup();
}
updateHeader(); updateBadge(); autosize();
setInterval(tick, 150);
})();
</script>
</body>
</html>
