<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>본격! 악녀로 살아남기</title><meta name="description" content="악녀로 빙의해 여섯 남주의 마음을 사로잡는 로맨스 판타지 비주얼 노벨 (체험판)">
<meta name="theme-color" content="#3a0b16">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap"><style>/* Layout: one full-bleed stage. Title, story and menus are layers over a painted scene;
   ivory "letter paper" panels with thin champagne-gold rules sit on a dim ballroom night. */
:root{
  --wine:#5c1424; --burgundy:#3a0b16; --ruby:#b3263f; --rose:#d98a9a; --dusty:#b9848c;
  --ivory:#fbf4ea; --ivory-2:#f3e7d6; --beige:#e9dcc6; --gold:#c9a861; --gold-hi:#ecd9a4;
  --ink:#3a1520; --ink-soft:#6e4b52; --night:#160910; --veil:rgba(22,9,16,.62);
  --f-logo:"Nanum Myeongjo","Gowun Batang",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Cinzel","Cormorant Garamond",serif;
  --f-italic:"Cormorant Garamond",serif;
  --text-scale:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.no-anim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- painted scene layers ---------- */
.scene{position:absolute;inset:0;transition:filter .8s ease}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene.focus{filter:blur(1.6px) brightness(.9)}
.scene.focus.bad{filter:blur(1.6px) saturate(.35) brightness(.65) sepia(.25) hue-rotate(-20deg)}
.scene.focus.dim{filter:blur(1.6px) brightness(.5) saturate(.8)}
.scene.bad{filter:saturate(.35) brightness(.7) sepia(.25) hue-rotate(-20deg)}
.scene.dim{filter:brightness(.55) saturate(.8)}
.tag-temp{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:30;
  font:600 10px/1 var(--f-ui);letter-spacing:.08em;color:var(--gold-hi);background:rgba(22,9,16,.55);
  border:1px solid rgba(201,168,97,.45);padding:5px 8px;border-radius:2px;pointer-events:none}

/* petals / light motes */
#motes{position:absolute;inset:0;pointer-events:none;z-index:2}

/* ---------- title ---------- */
#title .scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(22,9,16,.15),rgba(22,9,16,.78) 70%)}
.title-wrap{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);gap:clamp(18px,4vh,40px)}
.logo{text-align:center;animation:rise 1.2s ease both}
.logo .eyebrow{font:500 clamp(11px,1.6vw,14px)/1 var(--f-latin);letter-spacing:.42em;color:var(--gold);text-indent:.42em}
.logo h1{margin:.35em 0 .1em;font:800 clamp(34px,7.4vw,84px)/1.08 var(--f-logo);letter-spacing:-.01em;text-wrap:balance;
  background:linear-gradient(180deg,#fff6e3 0%,#ecd9a4 38%,#c9a861 62%,#f6e7bf 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(92,20,36,.9)) drop-shadow(0 10px 30px rgba(179,38,63,.45))}
.logo h1 .bang{color:var(--rose);-webkit-text-fill-color:#e9a3b1}
.logo .sub{font:italic 500 clamp(14px,2vw,20px)/1.2 var(--f-italic);color:#e7cfd3;letter-spacing:.12em}
.orn{display:block;margin:12px auto 0;width:min(320px,70vw);height:18px}
.menu{display:flex;flex-direction:column;gap:10px;width:min(340px,86vw);animation:rise 1.2s .3s ease both}
.menu .who{font:13px/1.4 var(--f-ui);color:#ead7da;text-align:center;min-height:1.4em}
.menu .who b{color:var(--gold-hi);font-weight:700}

/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;
  background:linear-gradient(180deg,#fffaf2,var(--ivory-2));color:var(--wine);border:1px solid var(--gold);border-radius:3px;
  font:700 15px/1.2 var(--f-latin);letter-spacing:.14em;box-shadow:0 2px 0 rgba(92,20,36,.25),0 8px 22px rgba(0,0,0,.28);
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;overflow:hidden}
.btn::before{content:"";position:absolute;inset:3px;border:1px solid rgba(201,168,97,.45);border-radius:2px;pointer-events:none}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);transition:left .6s ease}
.btn:hover::after{left:120%}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(92,20,36,.25),0 12px 28px rgba(179,38,63,.35)}
.btn:active{transform:translateY(1px)}
.btn .ko{font:600 12px/1 var(--f-ui);letter-spacing:0;color:var(--ink-soft)}
.btn.primary{background:linear-gradient(180deg,#7a1b30,var(--wine) 55%,var(--burgundy));color:var(--gold-hi);border-color:var(--gold)}
.btn.primary .ko{color:#e9c9cf}
.btn.primary::before{border-color:rgba(236,217,164,.35)}
.btn[disabled],.btn.locked{background:linear-gradient(180deg,#8c8486,#6f676a);color:#d6cfd1;border-color:#9a9294;cursor:not-allowed;box-shadow:none}
.btn[disabled] .ko,.btn.locked .ko{color:#ddd}
.btn[disabled]:hover{transform:none}
.btn.sm{min-height:36px;padding:6px 12px;font:700 13px/1.2 var(--f-ui);letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--gold-hi);border-color:rgba(201,168,97,.6);box-shadow:none}
.btn.ghost::before{display:none}
.lock-ic{width:14px;height:14px;flex:none}

.title-foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0;z-index:3;text-align:center;
  font:11px/1.4 var(--f-ui);color:rgba(236,217,164,.55);letter-spacing:.06em;padding-inline:16px}

/* ---------- panels (auth / name / menus) ---------- */
.veil{position:absolute;inset:0;z-index:40;background:var(--veil);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:fadeIn .25s ease}
.veil[hidden]{display:none!important}
.paper{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:
  radial-gradient(ellipse at top,rgba(255,255,255,.7),transparent 60%),linear-gradient(180deg,var(--ivory),var(--ivory-2));
  border:1px solid var(--gold);border-radius:4px;box-shadow:0 0 0 5px rgba(251,244,234,.12),0 30px 80px rgba(0,0,0,.55);
  padding:clamp(20px,4vw,34px);color:var(--ink);animation:rise .35s ease}
.paper::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,168,97,.55);pointer-events:none;border-radius:2px}
.paper.wide{width:min(1040px,100%)}
.paper h2{margin:0 0 4px;font:800 clamp(22px,3.2vw,30px)/1.2 var(--f-logo);color:var(--wine);text-align:center;text-wrap:balance}
.paper .eyebrow{display:block;text-align:center;font:600 11px/1 var(--f-latin);letter-spacing:.34em;color:var(--gold);margin-bottom:8px}
.paper .lead{text-align:center;color:var(--ink-soft);font:14px/1.6 var(--f-ui);margin:6px 0 18px}
.close-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(201,168,97,.7);background:var(--ivory);color:var(--wine);
  font:20px/1 var(--f-ui);display:grid;place-items:center;z-index:2}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font:700 13px/1 var(--f-ui);color:var(--wine);letter-spacing:.02em}
.field input,.field select{height:46px;padding:0 14px;border:1px solid #d8c39a;border-radius:3px;background:#fffdf8;color:var(--ink);
  font:16px/1 var(--f-body);box-shadow:inset 0 1px 3px rgba(92,20,36,.08)}
.field input:focus{outline:none;border-color:var(--ruby);box-shadow:0 0 0 3px rgba(179,38,63,.15)}
.err{min-height:1.3em;color:var(--ruby);font:600 13px/1.4 var(--f-ui);margin:4px 0 10px;text-align:center}
.ok{color:#2f6b43}
.tabs{display:flex;gap:4px;justify-content:center;margin:4px 0 18px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:8px 14px;border-radius:999px;font:700 14px/1 var(--f-ui);color:var(--ink-soft)}
.tab.on{background:var(--wine);color:var(--gold-hi);border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.linkish{background:none;border:none;color:var(--ruby);font:600 13px/1.4 var(--f-ui);text-decoration:underline;text-underline-offset:3px;padding:4px}
.note{font:12.5px/1.6 var(--f-ui);color:var(--ink-soft);text-align:center;margin-top:12px}
.sep{display:flex;align-items:center;gap:10px;color:var(--gold);font:11px/1 var(--f-latin);letter-spacing:.3em;margin:16px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.surnames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.pick{min-height:44px;border:1px solid #d8c39a;background:#fffdf8;border-radius:3px;font:700 15px/1.2 var(--f-body);color:var(--ink)}
.pick.on{background:linear-gradient(180deg,#f7d9df,#efc2cc);border-color:var(--ruby);color:var(--wine)}
.preview-name{text-align:center;font:800 22px/1.3 var(--f-logo);color:var(--wine);margin:6px 0 14px;min-height:1.3em}

/* ---------- story stage ---------- */
#chars{position:absolute;inset:0;z-index:5;pointer-events:none}
.sprite{position:absolute;bottom:0;height:min(88vh,980px);aspect-ratio:1/2;transform:translateX(-50%);transition:left .5s ease,opacity .45s ease,filter .4s ease;opacity:0}
.sprite.on{opacity:1}
.sprite.dimmed{filter:brightness(.6) saturate(.8)}
.sprite svg,.sprite img{width:100%;height:100%;display:block;object-fit:contain;object-position:bottom}
.sprite .stag{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:600 10px/1 var(--f-ui);color:rgba(236,217,164,.75);letter-spacing:.1em;white-space:nowrap;
  background:rgba(22,9,16,.45);padding:4px 7px;border:1px solid rgba(201,168,97,.35)}
.sprite.enter{animation:charIn .6s ease}
@keyframes charIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%)}}
.aura{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .9s ease}

#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:20;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px)}
.hbtn{height:34px;min-width:34px;padding:0 10px;border-radius:2px;border:1px solid rgba(201,168,97,.55);background:rgba(22,9,16,.55);color:var(--gold-hi);
  font:700 11px/1 var(--f-latin);letter-spacing:.12em;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
.hbtn:hover{background:rgba(92,20,36,.75)}
.hbtn.on{background:var(--wine);color:#fff}
.chapter-chip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 36px);left:12px;z-index:20;font:600 12px/1.3 var(--f-ui);color:#f2e3c4;text-shadow:0 1px 6px #000;pointer-events:none}

#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:10;width:min(1080px,calc(100% - 24px));
  min-height:clamp(150px,24vh,210px);padding:30px clamp(18px,3vw,36px) 22px;
  background:linear-gradient(180deg,rgba(251,244,234,.94),rgba(243,231,214,.95));border:1px solid var(--gold);border-radius:4px;
  box-shadow:0 0 0 4px rgba(22,9,16,.35),0 20px 50px rgba(0,0,0,.5);cursor:pointer;user-select:none}
#dialog::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,168,97,.5);pointer-events:none;border-radius:2px}
#dialog .corner{position:absolute;width:26px;height:26px;pointer-events:none}
#dialog .c1{top:-3px;left:-3px}#dialog .c2{top:-3px;right:-3px;transform:scaleX(-1)}#dialog .c3{bottom:-3px;left:-3px;transform:scaleY(-1)}#dialog .c4{bottom:-3px;right:-3px;transform:scale(-1)}
#nameplate{position:absolute;top:-19px;left:clamp(16px,3vw,34px);min-width:120px;padding:8px 20px 7px;background:linear-gradient(180deg,#7a1b30,var(--wine));
  color:var(--gold-hi);border:1px solid var(--gold);border-radius:2px;font:800 16px/1 var(--f-logo);letter-spacing:.04em;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.35)}
#nameplate[hidden]{display:none}
#nameplate .ttl{display:block;font:600 10px/1 var(--f-ui);color:#e9c9cf;letter-spacing:.06em;margin-top:4px}
#line{margin:0;font:500 calc(clamp(16px,1.9vw,19.5px) * var(--text-scale))/1.85 var(--f-body);color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-height:3.6em}
#line.narr{color:#4b2a33}
#line.mono{color:#7a3346;font-style:italic}
#line.quote{color:var(--wine);text-align:center;font-weight:700}
#next-ind{position:absolute;right:22px;bottom:14px;width:12px;height:12px;opacity:0}
#next-ind.on{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#dlg-tools{position:absolute;right:18px;top:-17px;display:flex;gap:4px}
#dlg-tools .hbtn{height:28px;font-size:10px;background:rgba(58,11,22,.86)}

/* choices */
#choices{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(22,9,16,.5);animation:fadeIn .35s ease;overflow:auto}
#choices[hidden]{display:none!important}
#choices .prompt{font:700 clamp(15px,1.8vw,18px)/1.5 var(--f-body);color:var(--gold-hi);text-align:center;text-shadow:0 2px 10px #000;margin-bottom:4px;max-width:720px}
.choice{position:relative;width:min(720px,100%);padding:15px 22px 15px 46px;text-align:left;background:rgba(251,244,234,.9);border:1px solid var(--gold);border-radius:3px;
  font:600 calc(clamp(15px,1.7vw,17.5px) * var(--text-scale))/1.6 var(--f-body);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:background .25s ease,color .25s ease,transform .15s ease;animation:rise .4s ease both;word-break:keep-all}
.choice::before{content:"";position:absolute;left:18px;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);border:1px solid var(--gold);background:transparent;transition:background .25s}
.choice:hover,.choice:focus-visible{background:linear-gradient(90deg,#f6d3db,#f0c3cd);color:var(--wine);transform:translateX(3px)}
.choice:hover::before{background:var(--ruby)}
.choice.picked{background:linear-gradient(90deg,var(--wine),#7a1b30);color:var(--gold-hi)}
.choice.picked::before{background:var(--gold-hi);border-color:var(--gold-hi)}
.choice.hidden-opt{border-color:#e7c46b;background:linear-gradient(90deg,rgba(255,248,226,.96),rgba(251,236,201,.95));box-shadow:0 0 0 2px rgba(231,196,107,.45),0 8px 28px rgba(201,168,97,.45)}
.choice .gem{display:inline-block;font:700 10px/1 var(--f-ui);letter-spacing:.08em;color:#8a6414;background:#fff3cc;border:1px solid #e0bb5a;padding:3px 6px;border-radius:2px;margin-right:8px;vertical-align:2px}
.choice .hint{display:block;margin-top:4px;font:600 12px/1.4 var(--f-ui);color:var(--ink-soft)}
.choice.picked .hint{color:#e9c9cf}

/* CG viewer in-story */
#cgshow{position:absolute;inset:0;z-index:25;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fadeIn .8s ease}
#cgshow[hidden]{display:none!important}
#cgshow .frame{position:relative;width:min(100%,calc(100vh * 16 / 9));aspect-ratio:16/9;max-height:100%}
#cgshow .frame svg{width:100%;height:100%;display:block}
#cgshow .cap{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);text-align:center;color:var(--gold-hi);text-shadow:0 2px 10px #000;width:calc(100% - 32px)}
#cgshow .cap b{display:block;font:800 clamp(18px,2.4vw,26px)/1.3 var(--f-logo)}
#cgshow .cap span{font:600 11px/1 var(--f-latin);letter-spacing:.3em}

/* chapter card */
#chapcard{position:absolute;inset:0;z-index:24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse,rgba(58,11,22,.9),rgba(22,9,16,.98));color:var(--gold-hi);text-align:center;padding:16px;animation:fadeIn .6s ease}
#chapcard[hidden]{display:none!important}
#chapcard .n{font:600 13px/1 var(--f-latin);letter-spacing:.5em;text-indent:.5em}
#chapcard .t{font:800 clamp(28px,5vw,52px)/1.2 var(--f-logo);color:#fff3dc;text-wrap:balance}

/* fx */
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}
#flash{position:absolute;inset:0;z-index:23;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .7s ease}
@keyframes flash{15%{opacity:.85}100%{opacity:0}}
#floaters{position:absolute;inset:0;z-index:22;pointer-events:none}
.floater{position:absolute;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(22,9,16,.7);border:1px solid rgba(201,168,97,.6);
  color:#fff3dc;font:700 13px/1 var(--f-ui);animation:floatUp 2.2s ease forwards;white-space:nowrap}
.floater svg{width:18px;height:18px}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.9)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);z-index:60;background:var(--wine);color:var(--gold-hi);border:1px solid var(--gold);
  padding:10px 18px;border-radius:3px;font:700 14px/1.4 var(--f-ui);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .3s ease;max-width:calc(100% - 32px);text-align:center}

/* ---------- save / load ---------- */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.slot{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#fffaf1,#f1e2cb);border:1px solid #d6bd87;border-radius:3px;overflow:hidden;
  text-align:left;padding:0;box-shadow:0 6px 18px rgba(92,20,36,.15);transition:transform .15s ease,box-shadow .2s}
.slot:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(92,20,36,.25)}
.slot .thumb{position:relative;aspect-ratio:16/9;background:var(--burgundy);border-bottom:1px solid #d6bd87}
.slot .thumb svg{width:100%;height:100%;display:block}
.slot .no{position:absolute;top:8px;left:8px;background:var(--wine);color:var(--gold-hi);font:700 11px/1 var(--f-latin);letter-spacing:.14em;padding:5px 8px;border:1px solid var(--gold)}
.slot .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;font:13px/1.45 var(--f-ui);color:var(--ink-soft)}
.slot .meta b{font:800 15px/1.35 var(--f-logo);color:var(--wine)}
.slot .meta .route{color:var(--ruby);font-weight:700}
.slot .meta .t{font-variant-numeric:tabular-nums}
.slot.empty .thumb{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#f6ead7 0 10px,#f1e2cb 10px 20px)}
.slot.empty .thumb span{font:700 16px/1 var(--f-latin);letter-spacing:.24em;color:var(--gold)}
.slot.auto{grid-column:1/-1;flex-direction:row}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;background:#fffaf1;border:1px solid #d6bd87;border-radius:3px;padding:0;text-align:left;overflow:hidden;box-shadow:0 6px 16px rgba(92,20,36,.12)}

.card .cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}

.profile dd{margin:0;color:var(--ink)}

.stat{background:#fffaf1;border:1px solid #e1cc9e;border-radius:3px;padding:12px 14px}

.stat .v{font:800 22px/1.2 var(--f-logo);color:var(--wine);margin:6px 0;font-variant-numeric:tabular-nums}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font:13.5px/1.55 var(--f-body)}

.log li small{display:block;color:var(--gold);font:700 11px/1.4 var(--f-ui)}
.relmap{width:100%;max-width:640px;margin:0 auto;height:auto;display:block;background:radial-gradient(ellipse,#fffaf1,#f1e2cb);border:1px solid #e1cc9e;border-radius:3px}
.empty-note{text-align:center;padding:26px 12px;color:var(--ink-soft);font:14px/1.7 var(--f-ui)}

/* ---------- gallery ---------- */

/* =========================================================

  function fx(kind){
    const r=rng(kind.length*97);
    if(kind==='wine'){ let o=''; for(let i=0;i<26;i++){ const x=650+r()*300,y=380+r()*260,s=r()*14+4; o+=`<ellipse cx="${x}" cy="${y}" rx="${s}" ry="${s*1.4}" fill="#8e0f2a" opacity="${.5+r()*.5}"/>`; }

    if(kind==='coins'){ let o=''; for(let i=0;i<9;i++){ const x=620+r()*360,y=720+r()*120; o+=`<ellipse cx="${x}" cy="${y}" rx="22" ry="10" fill="#e8c35a" stroke="#9c7424" stroke-width="2"/><path d="M${x-6} ${y} l6 -5 6 5 -6 5z" fill="#fff"/>`; } return o; }

    if(kind==='runes'){ return `<g fill="none" stroke="#c7a6ff" opacity=".8"><circle cx="800" cy="480" r="300" stroke-width="2"/><circle cx="800" cy="480" r="260" stroke-width="1" stroke-dasharray="10 8"/><path d="M800 180 L1060 630 H540Z M800 780 L540 330 H1060Z" stroke-width="1.5"/></g>`; }
    if(kind==='petals'){ let o=''; for(let i=0;i<40;i++){ const x=r()*1600,y=r()*900; o+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="5" transform="rotate(${r()*180} ${x} ${y})" fill="#e58aa0" opacity="${.4+r()*.5}"/>`; } return o; }
    if(kind==='shadow'){ return `<rect width="1600" height="900" fill="#12040a" opacity=".45"/>`; }

  function place(key, x, scale, flip, opt){
    const inner = sprite(key, opt).replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');

    n('재판은 사흘 만에 끝났다. 원작보다 열한 달이나 이른 결말이었다.'),
    say('cecilia','…넌 다를 줄 알았는데.'),
    q('『사냥제의 악녀 {full|은} 북쪽 끝 수도원의 탑에 갇혔다. 원작의 악녀조차 그렇게까지 하지는 않았다.』'),
    ending('bad_hunt'),
  ],

  };

  function hunterOf(S){ const r=S.flags.ribbon; return r && r!=='none' ? r : topHero(S); }
  function nightHero(S){ const h=S.flags.hunter; return h && h!=='leon_cecilia' ? h : topHero(S); }
  function leonRefuses(S){ if(S.flags.letOriginal) return false; if(S.flags.hunter==='leon') return true; return (S.aff.leon||0)+(S.tr.leon||0)*.6 >= 30; }
  function rainHero(S){ const a=S.flags.ally; return a && a!=='none' ? a : topHero(S); }
  function topHero(S){

    for(const h of HEROES){ const v=(S.aff[h]||0)+(S.tr[h]||0)*.6; if(v>bv){ bv=v; best=h; } }

})();

/* 배경음악·효과음: 외부 음원 없이 Web Audio로 합성하는 오르골풍 음악 (임시 음원) */
const Sound = (() => {
  let ctx=null, bgmGain=null, sfxGain=null, master=null, timer=null, mood=null, nextT=0, step=0;
  let vol = { bgm:.5, sfx:.7 };
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  const MOODS = {
    quiet:  { bpm:66, meter:4, prog:[[57,60,64],[53,57,60],[55,59,62],[52,55,59]], mel:[76,74,72,71,72,74,0,0, 76,77,76,74,72,0,71,0], kind:'arp' },
    morning:{ bpm:92, meter:4, prog:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]], mel:[79,76,72,76,79,0,81,79, 77,74,71,74,77,0,76,0], kind:'arp' },
    ball:   { bpm:132, meter:3, prog:[[62,66,69],[59,62,66],[55,59,62],[57,61,64]], mel:[74,0,78,81,0,78,79,0,76,74,0,73], kind:'waltz' },
    waltz:  { bpm:126, meter:3, prog:[[60,64,67],[57,60,64],[62,65,69],[55,59,62]], mel:[76,0,79,84,0,79,81,0,77,79,0,74], kind:'waltz' },
    night:  { bpm:60, meter:4, prog:[[57,60,64],[53,57,60],[50,53,57],[52,56,59]], mel:[0,0,76,0,0,0,74,0, 0,0,72,0,71,0,0,0], kind:'pad' },
    tense:  { bpm:84, meter:4, prog:[[50,53,57],[50,53,58],[49,52,57],[50,53,57]], mel:[0,0,0,0,62,0,61,0, 0,0,0,0,58,0,57,0], kind:'pulse' },
    bad:    { bpm:54, meter:4, prog:[[45,48,52],[43,46,50],[41,45,48],[40,44,47]], mel:[72,0,71,0,69,0,0,0, 68,0,0,0,64,0,0,0], kind:'pad' },
  };
  function ensure(){
    if(ctx) return true;
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);
      bgmGain = ctx.createGain(); bgmGain.gain.value=vol.bgm*.35; bgmGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value=vol.sfx*.5; sfxGain.connect(master);
      return true;
    }catch(e){ ctx=null; return false; }
  }
  function tone(freq, t, dur, type, gain, dest, attack=.005){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.05);
  }
  function bell(m,t,dur,gain){ if(!m) return; const f=mtof(m); tone(f,t,dur,'triangle',gain,bgmGain); tone(f*2,t,dur*.6,'sine',gain*.35,bgmGain); }
  function schedule(){
    if(!ctx || !mood) return;
    const M=MOODS[mood], beat=60/M.bpm, half=beat/2;
    while(nextT < ctx.currentTime + .25){
      const s=step, bar=Math.floor(s/(M.meter*2)), chord=M.prog[bar % M.prog.length], inBar=s%(M.meter*2);
      if(M.kind==='waltz'){
        if(inBar===0) tone(mtof(chord[0]-12),nextT,beat*1.6,'sine',.32,bgmGain);
        if(inBar===2||inBar===4) chord.forEach(n=>tone(mtof(n),nextT,beat*.7,'triangle',.07,bgmGain));
      } else if(M.kind==='arp'){
        if(inBar%2===0) bell(chord[(inBar/2)%3]+(inBar>=4?12:0),nextT,beat*1.8,.08);
        if(inBar===0) tone(mtof(chord[0]-12),nextT,beat*3.5,'sine',.22,bgmGain);
      } else if(M.kind==='pad'){
        if(inBar===0) chord.forEach(n=>tone(mtof(n),nextT,beat*M.meter*1.1,'sine',.07,bgmGain,.6));
        if(inBar===0) tone(mtof(chord[0]-12),nextT,beat*M.meter,'sine',.18,bgmGain,.3);
      } else if(M.kind==='pulse'){
        if(inBar%2===0) tone(mtof(chord[0]-12),nextT,half*1.2,'sine',.25,bgmGain);
        if(inBar===0) chord.forEach(n=>tone(mtof(n),nextT,beat*M.meter,'triangle',.04,bgmGain,.4));
      }
      const mel=M.mel[s % M.mel.length]; if(mel && s%1===0) bell(mel,nextT,beat*1.4,.09);
      nextT += half; step++;
    }
  }
  function play(k){
    if(k===mood) return; mood = MOODS[k] ? k : null;
    if(!ensure()) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    step=0; nextT=ctx.currentTime+.08;
    if(!timer) timer=setInterval(schedule,90);
  }
  function stop(){ mood=null; }
  function sfx(kind){
    if(!ensure()) return; if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const t=ctx.currentTime+.01;
    if(kind==='click'){ tone(1400,t,.05,'sine',.12,sfxGain); }
    else if(kind==='choice'){ tone(mtof(84),t,.35,'triangle',.18,sfxGain); tone(mtof(91),t+.07,.4,'sine',.12,sfxGain); }
    else if(kind==='heart'){ [88,91,96].forEach((m,i)=>tone(mtof(m),t+i*.07,.35,'sine',.13,sfxGain)); }
    else if(kind==='gem'){ [84,88].forEach((m,i)=>tone(mtof(m),t+i*.09,.4,'triangle',.13,sfxGain)); }
    else if(kind==='cg'){ [72,76,79,84,88].forEach((m,i)=>tone(mtof(m),t+i*.06,.8,'sine',.09,sfxGain)); }
    else if(kind==='save'){ tone(mtof(79),t,.2,'sine',.15,sfxGain); tone(mtof(86),t+.1,.3,'sine',.12,sfxGain); }
    else if(kind==='shock'){ tone(90,t,.45,'sawtooth',.12,sfxGain); tone(mtof(49),t,.6,'triangle',.12,sfxGain); }
  }
  function setVolume(k,v){ vol[k]=v; if(!ctx) return; if(k==='bgm') bgmGain.gain.value=v*.35; else sfxGain.gain.value=v*.5; }
  function unlock(){ if(ensure() && ctx.state==='suspended') ctx.resume().catch(()=>{}); }
  return { play, stop, sfx, setVolume, unlock, get mood(){ return mood; } };
})();

/* =========================================================
   저장소 3종
   - supabase : 이메일 회원가입/로그인 + 계정별 DB 저장 (웹 배포판)
   - claude   : claude.ai 계정 + 아티팩트 DB 저장 (claude.ai 미리보기판)
   - guest    : 이 기기 브라우저에만 저장
   슬롯 0 = 자동 저장, 1~3 = 수동 저장. 각 슬롯은 독립 문서/행으로 저장됩니다.
   ========================================================= */
const LS = {
  get(k, d=null){ try{ const v=localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const emptyRecords = () => ({ cg_unlocked:[], endings:[], met:[], settings:{} });
const clone = o => JSON.parse(JSON.stringify(o));

const GuestStore = {
  kind:'guest', label:'게스트 (이 기기에만 저장)',
  async listSlots(){ const r={}; for(let i=0;i<4;i++){ const s=LS.get('vs_guest_slot_'+i); if(s) r[i]=s; } return r; },
  async writeSlot(i, rec){ if(!LS.set('vs_guest_slot_'+i, rec)) throw new Error('이 브라우저는 저장 공간을 쓸 수 없어요. 개인 정보 보호 모드를 끄거나 로그인해 주세요.'); },
  async deleteSlot(i){ LS.del('vs_guest_slot_'+i); },
  async loadRecords(){ return { ...emptyRecords(), ...LS.get('vs_guest_records', {}) }; },
  async saveRecords(r){ LS.set('vs_guest_records', r); },
};

function SupabaseStore(client, user){
  const uid = user.id;
  return {
    kind:'supabase', label:'계정 저장', user,
    async listSlots(){
      const { data, error } = await client.from('save_slots').select('slot,data,chapter,route,playtime_sec,preview,saved_at').order('slot');
      if(error) throw new Error('저장 목록을 불러오지 못했어요. 네트워크를 확인해 주세요.');
      const r={}; (data||[]).forEach(row=>{ r[row.slot] = { slot:row.slot, data:row.data, chapter:row.chapter, route:row.route, playtime_sec:row.playtime_sec, preview:row.preview, saved_at:row.saved_at, label:row.data?.__label||'' }; });
      return r;
    },
    async writeSlot(i, rec){
      const { error } = await client.from('save_slots').upsert({ user_id:uid, slot:i, data:{...rec.data, __label:rec.label||''}, chapter:rec.chapter, route:rec.route, playtime_sec:rec.playtime_sec, preview:rec.preview, saved_at:rec.saved_at }, { onConflict:'user_id,slot' });
      if(error) throw new Error('저장하지 못했어요. 네트워크를 확인한 뒤 다시 시도해 주세요.');
    },
    async deleteSlot(i){ const { error } = await client.from('save_slots').delete().eq('slot', i); if(error) throw new Error('삭제하지 못했어요.'); },
    async loadRecords(){
      const { data, error } = await client.from('player_records').select('cg_unlocked,endings,met,settings').maybeSingle();
      if(error) throw new Error('수집 기록을 불러오지 못했어요.');
      return { ...emptyRecords(), ...(data||{}) };
    },
    async saveRecords(r){
      const { error } = await client.from('player_records').upsert({ user_id:uid, cg_unlocked:r.cg_unlocked, endings:r.endings, met:r.met, settings:r.settings, updated_at:new Date().toISOString() }, { onConflict:'user_id' });
      if(error) throw new Error('수집 기록을 저장하지 못했어요.');
    },
  };
}

function ClaudeStore(db, id){
  const base = 'data/users/' + id;
  const write = async (ref, body) => {
    try{ await ref.set(body); }
    catch(e){ throw new Error(e && e.code==='not_granted' ? '저장 권한이 없어요. 아티팩트의 권한 메뉴에서 데이터 저장을 허용해 주세요.' : '저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  };
  return {
    kind:'claude', label:'claude.ai 계정 저장',
    async listSlots(){
      const r={};
      for(let i=0;i<4;i++){ const s = await db.doc(`${base}/slot${i}`).get(); if(s.exists){ const d=s.data(); if(d && d.data) r[i]=clone(d); } }
      return r;
    },
    async writeSlot(i, rec){ await write(db.doc(`${base}/slot${i}`), clone(rec)); },
    async deleteSlot(i){ await db.doc(`${base}/slot${i}`).delete(); },
    async loadRecords(){ const s = await db.doc(`${base}/records`).get(); return { ...emptyRecords(), ...(s.exists ? clone(s.data()) : {}) }; },
    async saveRecords(r){ await write(db.doc(`${base}/records`), clone(r)); },
  };
}

/* =========================================================
   스토리 엔진: 상태, 명령 실행, 대사 출력, 선택지, 연출
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* 한국어 조사: {full|은} → 받침에 따라 은/는 */
function josa(word, j){
  const ch = word.charCodeAt(word.length-1);
  const has = ch>=0xAC00 && ch<=0xD7A3 ? ((ch-0xAC00)%28)!==0 : false;
  const map = {'은':['은','는'],'는':['은','는'],'이':['이','가'],'가':['이','가'],'을':['을','를'],'를':['을','를'],'과':['과','와'],'와':['과','와'],'아':['아','야'],'야':['아','야']};
  const p = map[j]; return p ? (has? p[0]: p[1]) : j;
}
function fill(text, S){
  if(typeof text==='function') text = text(S);
  if(text==null) return '';
  const v = { name:S.name, surname:S.surname, full:`${S.name} ${S.surname}` };
  return String(text).replace(/\{(name|surname|full)(?:\|([^}]+))?\}/g, (_,k,j) => v[k] + (j? josa(v[k], j) : ''));
}

function newState(name, surname){
  const aff={}, tr={}; HEROES.forEach(h=>{ aff[h]=10; tr[h]=5; });
  return { v:1, name, surname, scene:Story.start, idx:0, aff, tr, rep:-40, rival:10, power:30, info:0,
    style:{kind:0,calc:0,proud:0,flirt:0,ruthless:0}, flags:{}, ch:{}, log:[], chapter:'프롤로그', label:'', progress:0,
    playMs:0, view:{bg:'dark', chars:[], mood:''}, backlog:[], startedAt:Date.now() };
}

const repLabel = r => r<-50?'경멸':r<-20?'악명':r<10?'수군거림':r<40?'호기심':'선망';
const rivalLabel = r => r<20?'방심':r<40?'경계':r<60?'적의':'적대';
function topStyle(S){ let b='kind',bv=-1; for(const k in S.style){ if(S.style[k]>bv){bv=S.style[k];b=k;} } return bv>0? b : null; }
function routeLabel(S){ const h=Story.topHero(S); return h ? `공통 루트 · ${CHARS[h].name} 쪽으로 기울어짐` : '공통 루트'; }

const Game = (() => {
  let S=null, typing=null, waiting=null, autoOn=false, skipOn=false, autoTimer=null, busy=false;
  const P = { pos:{ ll:18, l:30, c:50, r:70, rr:82 } };

  /* ---------- visual layer ---------- */
  function renderBg(){
    const sc = $('#g-scene'); sc.innerHTML = Art.bgSVG(S.view.bg);
    sc.classList.toggle('bad', S.view.mood==='bad'); sc.classList.toggle('dim', S.view.mood==='dim');
  }
  function spriteHTML(who){
    const ov = (window.ART_OVERRIDES||{})[who];
    if(ov) return `<img src="${esc(ov)}" alt="" draggable="false">`;
    return Art.sprite(who, { dress:S.flags.dress }) + `<span class="stag">임시 일러스트</span>`;
  }
  function renderChars(enterWho){
    const box = $('#chars'); const keep = new Set(S.view.chars.map(c=>c.who));
    $$('.sprite', box).forEach(el => { if(!keep.has(el.dataset.who)){ el.classList.remove('on'); setTimeout(()=>el.remove(), 450); } });
    S.view.chars.forEach(c => {
      let el = box.querySelector(`.sprite[data-who="${c.who}"]`);
      if(!el){ el=document.createElement('div'); el.className='sprite'+(Art.ov(c.who)?' img':''); el.dataset.who=c.who; { const zz=(window.SPRITE_ZOOM||{})[c.who]||[1,0]; el.style.setProperty('--z', zz[0]); el.style.setProperty('--zy', zz[1]+'%'); } el.innerHTML=spriteHTML(c.who); box.appendChild(el);
        el.style.left = P.pos[c.pos]+'%'; requestAnimationFrame(()=>el.classList.add('on')); if(enterWho===c.who) el.classList.add('enter'); }
      el.style.left = P.pos[c.pos]+'%';
    });
    $('#g-scene').classList.toggle('focus', S.view.chars.length>0 && UI.settings.anim);
    const aura = $('#g-aura'); const last = S.view.chars[S.view.chars.length-1];
    if(last && CHARS[last.who] && HEROES.includes(last.who)){ aura.style.background=`radial-gradient(ellipse at ${P.pos[last.pos]}% 70%, ${CHARS[last.who].color}55, transparent 55%)`; aura.style.opacity=1; }
    else aura.style.opacity=0;
  }
  function focusSpeaker(who){ $$('#chars .sprite').forEach(el => el.classList.toggle('dimmed', !!who && S.view.chars.some(c=>c.who===who) && el.dataset.who!==who)); }
  function rebuildView(){ renderBg(); $('#chars').innerHTML=''; renderChars(); updateChip(); }
  function updateChip(){ $('#chapter-chip').textContent = S.chapter + (S.label? ' · '+S.label : ''); }

  /* ---------- effects ---------- */
  function floater(html, i){
    const el=document.createElement('div'); el.className='floater'; el.innerHTML=html;
    el.style.left = '12px'; el.style.top = `calc(env(safe-area-inset-top,0px) + ${(innerWidth<720?100:64) + i*42}px)`;
    $('#floaters').appendChild(el); setTimeout(()=>el.remove(), 2300);
  }
  function apply(e, quiet){
    if(!e) return;
    let i=0;
    if(e.aff) for(const h in e.aff){ const d=e.aff[h]; S.aff[h]=clamp((S.aff[h]||0)+d,0,100); if(d>0 && !quiet){ floater(`${Art.ICON.heart(CHARS[h].color)}${esc(CHARS[h].name)} 호감도`, i++); Sound.sfx('heart'); } }
    if(e.tr) for(const h in e.tr){ const d=e.tr[h]; S.tr[h]=clamp((S.tr[h]||0)+d,0,100); if(d>0 && !quiet){ floater(`${Art.ICON.gem(CHARS[h].color)}${esc(CHARS[h].name)} 신뢰도`, i++); Sound.sfx('gem'); } }
    if(e.rep) S.rep=clamp(S.rep+e.rep,-100,100);
    if(e.rival) S.rival=clamp(S.rival+e.rival,0,100);
    if(e.power) S.power=clamp(S.power+e.power,0,100);
    if(e.info) S.info=clamp(S.info+e.info,0,100);
    if(e.style) S.style[e.style]=(S.style[e.style]||0)+1;
    if(e.flag) Object.assign(S.flags, e.flag);
  }
  function doFx(k){
    if(k==='flash'){ const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
    if(k==='shake' && UI.settings.shake){ const st=$('#stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); Sound.sfx('shock'); }
    if(k==='bad'){ S.view.mood='bad'; renderBg(); }
    if(k==='dim'){ S.view.mood='dim'; renderBg(); }
  }

  /* ---------- line display ---------- */
  function speakerInfo(cmd){
    if(cmd.t!=='s') return null;
    const c = CHARS[cmd.who] || { name: cmd.who };
    return { name: fill(c.name, S), title: HEROES.includes(cmd.who)||cmd.who==='cecilia' ? c.title : '' };
  }
  function showLine(cmd){
    const text = fill(cmd.text, S);
    if(!text){ S.idx++; return run(); }
    const sp = speakerInfo(cmd), plate=$('#nameplate'), line=$('#line');
    if(sp){ plate.hidden=false; plate.innerHTML = esc(sp.name) + (sp.title? `<span class="ttl">${esc(sp.title)}</span>`:''); }
    else if(cmd.t==='m'){ plate.hidden=false; plate.innerHTML = esc(S.name) + `<span class="ttl">속마음</span>`; }
    else plate.hidden=true;
    line.className = cmd.t==='n'?'narr': cmd.t==='m'?'mono': cmd.t==='q'?'quote':'';
    focusSpeaker(cmd.t==='s'? cmd.who : null);
    S.backlog.push({ k:cmd.t, who: sp? sp.name : cmd.t==='m'? S.name : '', text });
    if(S.backlog.length>80) S.backlog.splice(0, S.backlog.length-80);
    typeOut(text);
  }
  function typeOut(text){
    const line=$('#line'), ind=$('#next-ind'); ind.classList.remove('on');
    clearTimeout(autoTimer); if(typing) clearInterval(typing.timer);
    const instant = UI.settings.instant || skipOn;
    if(instant){ line.textContent=text; typing=null; return lineDone(); }
    let i=0; line.textContent='';
    const cps = UI.settings.textSpeed; const stepMs = Math.max(8, 1000/cps);
    typing = { text, timer:setInterval(()=>{ i++; line.textContent=text.slice(0,i); if(i>=text.length){ clearInterval(typing.timer); typing=null; lineDone(); } }, stepMs) };
  }
  function finishTyping(){ if(!typing) return false; clearInterval(typing.timer); $('#line').textContent=typing.text; typing=null; lineDone(); return true; }
  function lineDone(){
    $('#next-ind').classList.add('on'); waiting='line';
    if(skipOn) autoTimer=setTimeout(next, 60);
    else if(autoOn) autoTimer=setTimeout(next, UI.settings.autoDelay*1000 + $('#line').textContent.length*25);
  }
  function next(){
    if(busy || !S) return;
    if(finishTyping()) return;
    if(waiting==='line'){ waiting=null; Sound.sfx('click'); S.idx++; run(); }
    else if(waiting==='cg'){ waiting=null; $('#cgshow').hidden=true; S.idx++; run(); }
    else if(waiting==='chap'){ waiting=null; $('#chapcard').hidden=true; S.idx++; run(); }
  }

  /* ---------- choices ---------- */
  function hintFor(o){
    if(o.hint && !o.e) return o.hint;
    const e=o.e||{}, out=[];
    for(const h in (e.aff||{})) out.push(`${CHARS[h].name} 호감 ${e.aff[h]>0?'▲':'▼'}`);
    for(const h in (e.tr||{})) out.push(`${CHARS[h].name} 신뢰 ${e.tr[h]>0?'▲':'▼'}`);
    if(e.rep) out.push(`평판 ${e.rep>0?'▲':'▼'}`);
    if(e.rival) out.push(`성녀의 경계 ${e.rival>0?'▲':'▼'}`);
    if(e.info) out.push('정보력 ▲'); if(e.power) out.push(`권력 ${e.power>0?'▲':'▼'}`);
    if(e.style) out.push(`성향: ${STYLES[e.style].label.replace(' 악녀','')}`);
    return out.join(' · ') || '분기 이동';
  }
  let curChoice=null;
  function refreshChoice(){ if(waiting==='choice' && curChoice && !busy) showChoice(curChoice); }

    curChoice=cmd; waiting='choice'; skipOn=false; syncToggles(); clearTimeout(autoTimer);
    const box=$('#choices'); box.innerHTML = `<div class="prompt">${esc(fill(cmd.prompt,S))}</div>`;
    Object.entries(cmd.opts).forEach(([k,o], i) => {
      if(o.hidden && !(o.cond && o.cond(S))) return;
      const b=document.createElement('button'); b.className='choice'+(o.hidden?' hidden-opt':''); b.style.animationDelay=(i*70)+'ms';
      b.innerHTML = (o.hidden? `<span class="gem">숨겨진 선택지 · ${esc(o.condText||'')}</span>`:'') + esc(fill(o.text,S)) + (UI.settings.hints? `<span class="hint">${esc(hintFor(o))}</span>`:'');
      b.onclick = () => pick(cmd, k, o, b);

  function pick(cmd, k, o, btn){
    if(busy) return; busy=true; Sound.sfx('choice');
    btn.classList.add('picked'); $$('#choices .choice').forEach(b=>b.disabled=true);
    setTimeout(() => {
      $('#choices').hidden=true; busy=false; waiting=null;
      S.ch[cmd.id]=k;
      S.log.push({ chapter:S.chapter, prompt:fill(cmd.prompt,S), text:fill(o.text,S), at:Date.now() });
      S.backlog.push({ k:'ch', who:'선택', text:fill(o.text,S) });
      apply(o.e);

  }

  /* ---------- main loop ---------- */
  function run(){
    let guard=0;
    while(S && guard++<500){
      const list = Story.scenes[S.scene]; const cmd = list && list[S.idx];
      if(!cmd){ console.warn('scene end', S.scene); return; }
      if(cmd.if && !cmd.if(S)){ S.idx++; continue; }
      switch(cmd.t){
        case 'meta': if(cmd.chapter) S.chapter=cmd.chapter; S.label=cmd.label||''; S.progress=cmd.progress??S.progress; updateChip(); S.idx++; continue;
        case 'bg': S.view.bg=cmd.k; S.view.mood=cmd.dim?'dim':''; renderBg(); S.idx++; continue;
        case 'show': { const ex=S.view.chars.find(c=>c.who===cmd.who); if(ex) ex.pos=cmd.pos; else S.view.chars.push({who:cmd.who,pos:cmd.pos}); renderChars(cmd.enter?cmd.who:null); S.idx++; continue; }
        case 'hide': S.view.chars = cmd.who==='*' ? [] : S.view.chars.filter(c=>c.who!==cmd.who); renderChars(); S.idx++; continue;
        case 'music': S.view.music=cmd.k; Sound.play(cmd.k); S.idx++; continue;
        case 'fx': doFx(cmd.k); S.idx++; continue;
        case 'eff': apply(cmd.e); S.idx++; continue;
        case 'meet': UI.recordMet(cmd.id); S.idx++; continue;
        case 'auto': S.idx++; UI.autosave(cmd.label); continue;
        case 'go': S.scene=cmd.id; S.idx=0; continue;
        case 'chap': $('#chapcard').innerHTML=`<div class="n">${esc(cmd.n)}</div><div class="t">${esc(cmd.title)}</div>${Art.ICON.orn()}`; $('#chapcard').hidden=false; waiting='chap';
          clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(waiting==='chap') next(); }, skipOn? 300 : 2600); return;
        case 'cg': { const def=CGS.find(c=>c.id===cmd.id); UI.unlockCG(cmd.id); Sound.sfx('cg');
          $('#cgshow').innerHTML=`<div class="frame${Art.ov(cmd.id)?' full':''}">${Art.cgHTML(def,{dress:S.flags.dress})}</div><div class="cap"><span>CG UNLOCKED</span><b>${esc(def.title)}</b></div>`;
          $('#cgshow').hidden=false; waiting='cg'; clearTimeout(autoTimer); if(skipOn||autoOn) autoTimer=setTimeout(()=>{ if(waiting==='cg') next(); }, skipOn?400:3000); return; }
        case 'n': case 'm': case 'q': case 's': showLine(cmd); return;
        case 'choice': showChoice(cmd); return;
        case 'ending': UI.showEnding(cmd.id); return;
        case 'demoEnd': UI.showDemoEnd(cmd); return;
        case 'clear': UI.recordClear(cmd.id); S.idx++; continue;
        default: S.idx++; continue;
      }
    }
  }

  function start(state){
    S = state; autoOn=false; skipOn=false; syncToggles(); waiting=null; busy=false;
    $('#choices').hidden=true; $('#cgshow').hidden=true; $('#chapcard').hidden=true; $$('.endcard').forEach(e=>e.hidden=true);

  function syncToggles(){ $('#hb-auto')?.classList.toggle('on', autoOn); $('#hb-skip')?.classList.toggle('on', skipOn); }
  function toggleAuto(){ autoOn=!autoOn; if(autoOn) skipOn=false; syncToggles(); if(autoOn && waiting==='line' && !typing) autoTimer=setTimeout(next, 600); if(!autoOn) clearTimeout(autoTimer); }
  function toggleSkip(){ skipOn=!skipOn; if(skipOn) autoOn=false; syncToggles(); if(skipOn){ finishTyping(); if(waiting) autoTimer=setTimeout(next, 60); } else clearTimeout(autoTimer); }
  function pause(){ clearTimeout(autoTimer); autoOn=false; skipOn=false; syncToggles(); }
  function stop(){ pause(); if(typing) clearInterval(typing.timer); typing=null; S=null; }

  return { start, next, refreshChoice, toggleAuto, toggleSkip, pause, stop, apply, get state(){ return S; }, set state(v){ S=v; } };
})();

  function openName(prefill){

    const isCustom = !base.includes(S0.surname);
    const p = openPanel(`<span class="eyebrow">${prefill?'RENAME':'NEW GAME'}</span><h2>그대의 이름은</h2>
      <p class="lead">빙의한 악녀의 이름과 가문을 정해 주세요. 모든 대사와 편지, 엔딩에 반영됩니다.</p>
      <form id="nm-form" novalidate>
        <div class="field"><label for="nm-name">이름 (1~8자)</label><input id="nm-name" maxlength="8" autocomplete="off" placeholder="예: 아리아" value="${esc(S0.name)}"></div>
        <div class="field"><label>성씨 (공작가)</label></div>
        <div class="surnames">${base.map(s=>`<button type="button" class="pick${S0.surname===s?' on':''}" data-s="${s}">${s}</button>`).join('')}<button type="button" class="pick${isCustom?' on':''}" data-s="__custom">직접 입력</button></div>
        <div class="field" id="nm-cwrap" ${isCustom?'':'hidden'}><label for="nm-custom">성씨 직접 입력 (1~8자)</label><input id="nm-custom" maxlength="8" autocomplete="off" value="${isCustom?esc(S0.surname):''}"></div>
        <div class="preview-name" id="nm-prev" aria-live="polite"></div>
        <div class="err" id="nm-err" role="alert"></div>
        <button class="btn primary" type="submit" style="width:100%">${prefill?'SAVE <span class="ko">이름 변경</span>':'BEGIN <span class="ko">이야기 시작</span>'}</button>
      </form>`);
    let sur = isCustom ? '__custom' : S0.surname;
    const nameIn=p.querySelector('#nm-name'), cust=p.querySelector('#nm-custom');
    const cur = () => ({ name:nameIn.value.trim(), surname: sur==='__custom' ? cust.value.trim() : sur });
    const prev = () => { const c=cur(); p.querySelector('#nm-prev').textContent = c.name ? `${c.name} ${c.surname||'…'}` : ''; };
    $$('.pick',p).forEach(b=>b.onclick=()=>{ sur=b.dataset.s; $$('.pick',p).forEach(x=>x.classList.toggle('on',x===b)); p.querySelector('#nm-cwrap').hidden = sur!=='__custom'; if(sur==='__custom') cust.focus(); prev(); });
    nameIn.oninput=prev; cust.oninput=prev; prev(); setTimeout(()=>nameIn.focus(),30);

      if(!c.name) return err.textContent='이름을 입력해 주세요.';
      if(!ok(c.name)) return err.textContent='이름은 한글이나 영문 1~8자로 정해 주세요.';
      if(!c.surname || !ok(c.surname)) return err.textContent='성씨는 한글이나 영문 1~8자로 정해 주세요.';
      closePanel();
      if(prefill){ Game.state.name=c.name; Game.state.surname=c.surname; toast(`이제부터 ${c.name} ${c.surname}입니다.`); return; }
      beginGame(newState(c.name, c.surname));
    };

  function beginGame(state){ screen('game'); startPlayTick(); Game.start(state); }

  /* ---------- play time & autosave ---------- */
  function startPlayTick(){ stopPlayTick(); playTick=setInterval(()=>{ const S=Game.state; if(S && !document.hidden) S.playMs+=1000; }, 1000); }
  function stopPlayTick(){ clearInterval(playTick); playTick=null; }
  function buildRec(slot, label){
    const S=Game.state; const data=JSON.parse(JSON.stringify(S)); data.backlog=data.backlog.slice(-30);
    return { slot, data, label:label||S.label, chapter:S.chapter + (S.label? ' · '+S.label:''), route:routeLabel(S), playtime_sec:Math.round(S.playMs/1000),
      preview:JSON.stringify({ bg:S.view.bg, chars:S.view.chars.map(c=>c.who), dress:S.flags.dress||'red', progress:S.progress }), saved_at:new Date().toISOString() };
  }
  function autosave(label){
    if(!Game.state || Game.state.ended) return;
    const rec = buildRec(0, '자동 저장 · '+(label||'')); lastAuto=Date.now();
    store.writeSlot(0, rec).then(()=>toast('자동 저장했어요 · '+(label||''))).catch(e=>toast(e.message));
  }

  /* ---------- save / load ---------- */
  async function openSlots(mode){
    const inGame = !!Game.state;
    const p = openPanel(`<span class="eyebrow">${mode==='save'?'SAVE':'LOAD'}</span><h2>${mode==='save'?'기록 남기기':'기록 불러오기'}</h2>

    let slots={};
    try{ slots = await store.listSlots(); }catch(e){ p.querySelector('#slots').innerHTML=`<div class="empty-note">${esc(e.message)}</div>`; return; }
    const card = (i) => {
      const s=slots[i], auto=i===0;
      const no = auto? 'AUTO' : `SLOT ${i}`;
      if(!s) return `<div class="slot empty${auto?' auto':''}"><div class="thumb"><span>${auto?'NO DATA':'NEW SAVE'}</span><b class="no">${no}</b></div>
        <div class="meta"><b>${auto?'자동 저장 기록 없음':'비어 있는 슬롯'}</b><span>${auto?'주요 분기 직전에 자동으로 기록돼요.':'아직 기록이 없어요.'}</span></div>
        <div class="slot-actions">${mode==='save' && !auto && inGame?`<button class="btn sm primary" data-act="save" data-i="${i}">여기에 저장</button>`:''}</div></div>`;
      let pv={}; try{ pv=JSON.parse(s.preview||'{}'); }catch(e){}
      return `<div class="slot${auto?' auto':''}"><div class="thumb">${Art.thumbSVG(pv.bg||'ballroom', pv.chars||[], {dress:pv.dress})}<b class="no">${no}</b></div>
        <div class="meta"><b>${esc(s.chapter||'')}</b><span class="route">${esc(s.route||'공통 루트')}</span>
        <span>${esc(s.data?.name||'')} ${esc(s.data?.surname||'')} · 진행도 ${pv.progress??0}%</span>
        <span class="t">${fmtDate(s.saved_at)} · 플레이 ${fmtTime(s.playtime_sec)}</span></div>
        <div class="slot-actions">${mode==='load'?`<button class="btn sm primary" data-act="load" data-i="${i}">불러오기</button>`:''}
        ${mode==='save' && !auto && inGame?`<button class="btn sm primary" data-act="save" data-i="${i}">덮어쓰기</button>`:''}
        <button class="btn sm" data-act="del" data-i="${i}">삭제</button></div></div>`;
    };
    p.querySelector('#slots').innerHTML = [1,2,3].map(card).join('') + card(0);
    const conf = p.querySelector('#slot-confirm');
    const ask = (msg, yes) => { conf.innerHTML = `<div class="confirm">${msg}<div class="row"><button class="btn sm primary" id="cf-y">확인</button><button class="btn sm" id="cf-n">취소</button></div></div>`;
      conf.querySelector('#cf-y').onclick = yes; conf.querySelector('#cf-n').onclick = () => conf.innerHTML=''; conf.querySelector('#cf-y').focus(); };
    $$('[data-act]', p).forEach(b => b.onclick = () => {
      const i=+b.dataset.i, act=b.dataset.act;
      const doSave = async () => { b.disabled=true; try{ await store.writeSlot(i, buildRec(i)); Sound.sfx('save'); toast(`SLOT ${i}에 저장했어요.`); closePanel(); }catch(e){ toast(e.message); b.disabled=false; } };
      if(act==='save'){ if(slots[i]) ask(`SLOT ${i}의 기존 기록을 지우고 지금 진행 상황으로 덮어쓸까요?`, doSave); else doSave(); }
      if(act==='load'){ const go=()=>{ closePanel(); loadRec(slots[i]); }; if(inGame) ask('지금 진행 중인 내용 중 저장하지 않은 부분은 사라져요. 불러올까요?', go); else go(); }
      if(act==='del') ask(`${i===0?'자동 저장':'SLOT '+i} 기록을 삭제할까요? 되돌릴 수 없어요.`, async()=>{ try{ await store.deleteSlot(i); toast('삭제했어요.'); closePanel(); openSlots(mode); refreshTitle(); }catch(e){ toast(e.message); } });
    });
  }
  function loadRec(rec){

  async function continueGame(){

  }

  function eventsDone(S){
    const out=[]; const f=S.flags;
    if(f.wine==='catch') out.push(['와인 사건','세실리아의 손목을 붙잡아 함정을 막았다.']);
    if(f.wine==='self') out.push(['와인 사건','쏟아지는 와인을 대신 받아 평판을 지켰다.']);
    if(f.wine==='expose') out.push(['와인 사건','신전 금화를 드러내 함정을 폭로했다.']);
    if(f.wine==='pour') out.push(['와인 사건', f.apologized?'원작대로 와인을 끼얹었지만, 공개 사과로 수습했다.':'원작대로 와인을 끼얹었다.']);
    if(f.cedricDeal) out.push(['세드릭과의 거래','첫 정보를 외상으로 샀다. 언젠가 값을 치러야 한다.']);
    if(f.kasianNorth) out.push(['북부의 흉작','카시안에게 곡물 운송 방해를 귀띔했다.']);
    if(f.lucielKnows) out.push(['영혼의 결',f.lucielPact?'루시엘과 비밀 계약을 맺었다.':'루시엘에게 빙의 사실을 들켰다.']);
    if(f.sawPriest) out.push(['커튼 뒤의 신관','세실리아가 신관과 밀담하는 장면을 목격했다.']);
    if(f.dance) out.push(['첫 왈츠',`${CHARS[f.dance].name}${josa(CHARS[f.dance].name,"와")} 첫 왈츠를 췄다.`]);
    if(f.cecilia) out.push(['복도의 대면',{war:'세실리아에게 선전포고했다.',feign:'세실리아 앞에서 모르는 척했다.',deal:'세실리아에게 불가침을 제안했다.'}[f.cecilia]]);
    return out;
  }
  const Zm = id => Math.max(1, ((window.SPRITE_ZOOM||{})[id]||[1])[0]);
  function relMap(S){
    const W=760,H=520,cx=380,cy=250,R=190;
    const pts=HEROES.map((h,i)=>{ const a=-Math.PI/3+i*Math.PI*2/6; return {h,x:cx+Math.cos(a)*R*1.25,y:cy+Math.sin(a)*R}; });
    const cec={x:cx,y:cy+R+60};
    let o=`<svg class="relmap" viewBox="0 0 ${W} ${H+40}" role="img" aria-label="관계도"><defs>${pts.map(p=>`<clipPath id="rc-${p.h}"><circle cx="${p.x}" cy="${p.y}" r="34"/></clipPath>`).join('')}<clipPath id="rc-me"><circle cx="${cx}" cy="${cy}" r="44"/></clipPath><clipPath id="rc-cec"><circle cx="${cec.x}" cy="${cec.y}" r="30"/></clipPath></defs>`;
    pts.forEach(p=>{ const c=CHARS[p.h], met=records.met.includes(p.h), a=S.aff[p.h], t=S.tr[p.h];
      o+=`<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${met?c.color:'#c9b9a0'}" stroke-width="${1+a/12}" opacity="${met?.85:.35}" ${t<15?'stroke-dasharray="6 6"':''}/>`;
      if(met) o+=`<line x1="${cec.x}" y1="${cec.y}" x2="${p.x}" y2="${p.y}" stroke="#6fa8bf" stroke-width="1.2" stroke-dasharray="3 5" opacity="${Math.max(.15, .8 - a/100)}"/>`; });
    o+=`<circle cx="${cx}" cy="${cy}" r="46" fill="#5c1424" stroke="#c9a861" stroke-width="3"/><g clip-path="url(#rc-me)"><g transform="translate(${cx-60} ${cy-114}) scale(.4)"></g></g>`; o+=Art.crest(cx, cy);
    o+=`<text x="${cx}" y="${cy+66}" text-anchor="middle" font-family="Nanum Myeongjo,serif" font-weight="800" font-size="15" fill="#5c1424">${esc(S.name)}</text>`;
    pts.forEach(p=>{ const c=CHARS[p.h], met=records.met.includes(p.h);
      o+=`<circle cx="${p.x}" cy="${p.y}" r="36" fill="${met?c.color:'#8b7f80'}" stroke="#c9a861" stroke-width="2.5"/>`;
      o+= met? (Art.ov(p.h) ? `<image href="${esc(Art.ov(p.h))}" x="${p.x-60*Zm(p.h)}" y="${p.y-42*Zm(p.h)}" width="${120*Zm(p.h)}" height="${200*Zm(p.h)}" preserveAspectRatio="xMidYMin slice" clip-path="url(#rc-${p.h})"/>` : `<g clip-path="url(#rc-${p.h})"><g transform="translate(${p.x-54} ${p.y-102}) scale(.36)">${Art.sprite(p.h).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g></g>`) : `<text x="${p.x}" y="${p.y+8}" text-anchor="middle" font-size="24" fill="#fff">?</text>`;
      o+=`<text x="${p.x}" y="${p.y+54}" text-anchor="middle" font-family="Nanum Myeongjo,serif" font-weight="800" font-size="14" fill="#3a1520">${met?esc(c.name):'???'}</text>`;
      if(met) o+=`<text x="${p.x}" y="${p.y+72}" text-anchor="middle" font-family="Gowun Dodum,sans-serif" font-size="12" fill="#6e4b52">♥ ${S.aff[p.h]} · ◆ ${S.tr[p.h]}</text>`; });
    const cm=records.met.includes('cecilia');
    o+=`<circle cx="${cec.x}" cy="${cec.y}" r="32" fill="${cm?'#6fa8bf':'#8b7f80'}" stroke="#c9a861" stroke-width="2"/>`;
    o+= cm? (Art.ov('cecilia') ? `<image href="${esc(Art.ov('cecilia'))}" x="${cec.x-62}" y="${cec.y-58}" width="124" height="206" preserveAspectRatio="xMidYMin slice" clip-path="url(#rc-cec)"/>` : `<g clip-path="url(#rc-cec)"><g transform="translate(${cec.x-45} ${cec.y-86}) scale(.3)">${Art.sprite('cecilia').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g></g>`) : '';
    o+=`<text x="${cec.x+44}" y="${cec.y+5}" font-family="Nanum Myeongjo,serif" font-weight="800" font-size="14" fill="#3a1520">${cm?'세실리아 · 경계 '+S.rival:'???'}</text>`;
    o+=`</svg><p class="note">선의 굵기는 호감도, 점선은 신뢰가 낮은 관계예요. 하늘색 점선은 아직 남아 있는 원작 여주인공을 향한 연심입니다.</p>`;
    return o;
  }

  /* ---------- gallery / endings ---------- */
  function openGallery(tab='cg'){
    const p=openPanel(`<span class="eyebrow">GALLERY</span><h2>일러스트 전시실</h2>
      <div class="tabs"><button class="tab" data-t="cg">CG 갤러리</button><button class="tab" data-t="end">엔딩 목록</button></div><div id="gb"></div>`, true);
    const body=p.querySelector('#gb');
    const draw=t=>{
      $$('.tab',p).forEach(b=>b.classList.toggle('on',b.dataset.t===t));
      if(t==='cg'){
        const real=CGS.filter(c=>!c.soon), got=real.filter(c=>records.cg_unlocked.includes(c.id)).length;
        body.innerHTML=`<div class="count">수집 ${got} / ${real.length}</div><div class="gal">${CGS.map(c=>{ const on=records.cg_unlocked.includes(c.id);
          return `<button class="gi${on?'':' locked'}${c.soon?' soon':''}" data-id="${c.id}" ${on?'':'aria-disabled="true"'}><div class="im">${c.soon?'':Art.cgHTML(c,{},'thumb')}${on?'':`<div class="lk">${Art.ICON.lock()}</div>`}</div>
          <div class="gt">${on?esc(c.title):c.soon?esc(c.title):'잠긴 CG'}<small>${on?'획득 완료':esc(c.cond)}</small></div></button>`; }).join('')}</div>
          <p class="note">CG는 원본 비율 그대로 보여 드려요.</p>`;
        $$('.gi',body).forEach(b=>b.onclick=()=>{ if(records.cg_unlocked.includes(b.dataset.id)) viewer(b.dataset.id); else toast('아직 획득하지 않은 CG예요.'); });
      } else {
        const got=ENDINGS.filter(e=>records.endings.includes(e.id)).length;
        body.innerHTML=`<div class="count">달성 ${got} / ${ENDINGS.length}${records.endings.includes('clear_ch5')?' · 제5장 클리어':records.endings.includes('clear_ch4')?' · 제4장 클리어':records.endings.includes('clear_ch3')?' · 제3장 클리어':records.endings.includes('clear_ch2')?' · 제2장 클리어':records.endings.includes('clear_ch1')?' · 제1장 클리어':''}</div><div class="ends">${ENDINGS.map(e=>{ const on=records.endings.includes(e.id);
          return `<div class="end${on?' got':' locked'}${e.soon?' soon':''}"><span class="kind">${esc(e.kind)}</span><b>${on||e.soon?esc(e.title):'잠긴 엔딩'}</b><span>${on?'달성 완료': e.soon? '후속 챕터에서 공개 예정' : esc(e.cond)}</span></div>`; }).join('')}</div>`;
      }
    };
    $$('.tab',p).forEach(b=>b.onclick=()=>draw(b.dataset.t)); draw(tab);
  }
  function viewer(id){
    const list=CGS.filter(c=>records.cg_unlocked.includes(c.id)); let i=list.findIndex(c=>c.id===id);
    const v=$('#viewer');
    const draw=()=>{ const c=list[i]; const ov=(window.ART_OVERRIDES||{})[c.id];
      v.innerHTML=`<div class="vf${ov?' tall':''}">${ov?`<img src="${esc(ov)}" alt="">`:Art.cgSVG(c,{dress:Game.state?.flags?.dress})}</div><div class="vc">${esc(c.title)}<small>${esc(c.cond)} · ${i+1} / ${list.length}</small></div>
      <div class="vnav"><button class="btn sm" id="v-prev">‹ 이전</button><button class="btn sm primary" id="v-close">닫기</button><button class="btn sm" id="v-next">다음 ›</button></div>`;
      v.querySelector('#v-prev').onclick=()=>{ i=(i-1+list.length)%list.length; draw(); };
      v.querySelector('#v-next').onclick=()=>{ i=(i+1)%list.length; draw(); };
      v.querySelector('#v-close').onclick=()=>{ v.hidden=true; };
    };
    draw(); v.hidden=false; v.querySelector('#v-close').focus();
  }

  /* ---------- settings ---------- */
  function openSettings(){
    const S=Game.state;
    const p=openPanel(`<span class="eyebrow">SETTINGS</span><h2>환경 설정</h2><div id="sb"></div>`);
    const sw=(k)=>`<button class="sw${settings[k]?' on':''}" data-sw="${k}" role="switch" aria-checked="${settings[k]}"></button>`;
    p.querySelector('#sb').innerHTML=`
      <div class="set"><label for="s-bgm">배경음악 음량<small>임시 합성 음원</small></label><input id="s-bgm" type="range" min="0" max="1" step=".05" value="${settings.bgm}"></div>
      <div class="set"><label for="s-sfx">효과음 음량</label><input id="s-sfx" type="range" min="0" max="1" step=".05" value="${settings.sfx}"></div>
      <div class="set"><label for="s-ts">대사 출력 속도<small id="s-ts-v">초당 ${settings.textSpeed}자</small></label><input id="s-ts" type="range" min="10" max="120" step="5" value="${settings.textSpeed}"></div>
      <div class="set"><label for="s-ad">자동 진행 속도<small id="s-ad-v">다음 대사까지 ${settings.autoDelay}초</small></label><input id="s-ad" type="range" min=".6" max="4" step=".2" value="${settings.autoDelay}"></div>
      <div class="set"><label>텍스트 즉시 표시<small>타이핑 효과 없이 한 번에</small></label>${sw('instant')}</div>
      <div class="set"><label>텍스트 크기</label><div class="seg" id="s-size">${[[.9,'작게'],[1,'보통'],[1.15,'크게'],[1.3,'아주 크게']].map(([v,l])=>`<button data-v="${v}" class="${settings.textScale==v?'on':''}">${l}</button>`).join('')}</div></div>
      <div class="set"><label>화면 흔들림 효과</label>${sw('shake')}</div>
      <div class="set"><label>애니메이션 효과<small>끄면 저사양 기기에서 더 부드러워요</small></label>${sw('anim')}</div>
      <div class="set"><label>선택지 힌트<small>선택 결과의 방향을 미리 보여 줘요 (난이도 낮춤)</small></label>${sw('hints')}</div>
      <div class="set"><label for="s-lang">언어</label><select id="s-lang" class="field" style="height:40px;border:1px solid #d8c39a;border-radius:3px;background:#fffdf8;color:var(--ink);padding:0 10px"><option>한국어</option></select></div>
      <div class="set"><label>저장 데이터 관리<small>${esc(store.label)}</small></label><div class="row"><button class="btn sm" id="s-slots">슬롯 관리</button>${S?'<button class="btn sm" id="s-rename">이름 바꾸기</button>':''}</div></div>
      <div class="set"><label>계정</label><div class="row">${store.kind==='supabase'?'<button class="btn sm" id="s-logout">로그아웃</button>':authMode()==='supabase'?'<button class="btn sm" id="s-login">로그인 / 회원가입</button>':'<span class="note" style="margin:0;text-align:left">'+(store.kind==='claude'?'claude.ai 계정으로 저장 중':'게스트 모드')+'</span>'}</div></div>
      <div class="row" style="margin-top:16px"><button class="btn sm" id="s-reset">기본값으로</button><button class="btn sm primary" data-close2>완료</button></div>`;
    const bind=(id,k,fmt)=>{ const el=p.querySelector(id); el.oninput=()=>{ settings[k]=+el.value; if(fmt) fmt(); applySettings(); }; el.onchange=saveSettings; };
    bind('#s-bgm','bgm'); bind('#s-sfx','sfx',()=>Sound.sfx('click'));
    bind('#s-ts','textSpeed',()=>p.querySelector('#s-ts-v').textContent=`초당 ${settings.textSpeed}자`);
    bind('#s-ad','autoDelay',()=>p.querySelector('#s-ad-v').textContent=`다음 대사까지 ${settings.autoDelay}초`);
    $$('[data-sw]',p).forEach(b=>b.onclick=()=>{ const k=b.dataset.sw; settings[k]=!settings[k]; b.classList.toggle('on',settings[k]); b.setAttribute('aria-checked',settings[k]); applySettings(); saveSettings(); if(k==='hints') Game.refreshChoice(); });
    $$('#s-size button',p).forEach(b=>b.onclick=()=>{ settings.textScale=+b.dataset.v; $$('#s-size button',p).forEach(x=>x.classList.toggle('on',x===b)); applySettings(); saveSettings(); });
    p.querySelector('#s-slots').onclick=()=>openSlots(S?'save':'load');
    p.querySelector('#s-rename')?.addEventListener('click',()=>openName({name:S.name,surname:S.surname}));
    p.querySelector('#s-logout')?.addEventListener('click',async()=>{ await sb.auth.signOut(); closePanel(); toast('로그아웃했어요.'); if(Game.state) toTitle(); });
    p.querySelector('#s-login')?.addEventListener('click',()=>openAuth('login'));
    p.querySelector('#s-reset').onclick=()=>{ Object.assign(settings, DEFAULTS); applySettings(); saveSettings(); closePanel(); openSettings(); toast('기본 설정으로 되돌렸어요.'); };
    p.querySelector('[data-close2]').onclick=closePanel;
  }

  /* ---------- backlog ---------- */
  function openLog(){
    const S=Game.state; if(!S) return;
    const p=openPanel(`<span class="eyebrow">LOG</span><h2>지난 대사</h2><div class="backlog">${S.backlog.map(b=>`<div class="bl ${b.k==='m'?'mono':b.k==='n'||b.k==='q'?'narr':b.k==='ch'?'ch':''}">${b.who?`<b>${esc(b.who)}</b>`:''}<p>${esc(b.text)}</p></div>`).join('') || '<div class="empty-note">아직 대사가 없어요.</div>'}</div>`);
    const paper=p; setTimeout(()=>paper.scrollTop=paper.scrollHeight, 20);
  }

  /* ---------- endings ---------- */
  function showEnding(id){
    const S=Game.state, e=ENDINGS.find(x=>x.id===id); S.ended=true; recordEnding(id); Sound.play('bad');
    const el=$('#end-card'); el.className='endcard bad'; el.hidden=false;
    el.innerHTML=`<div class="inner"><span class="k">${esc(e.kind)}</span><h2>${esc(e.title)}</h2>
      <p>${esc(S.name)} ${esc(S.surname)}의 이야기는 원작이 정해 둔 마지막 문장에서 멈췄습니다. 하지만 이건 수많은 결말 중 하나일 뿐이에요.</p>
      <p style="font-size:13px;color:#b9a3a7">마지막 자동 저장 지점으로 돌아가, 다른 방법으로 수습할 수 있어요.</p>
      <div class="row"><button class="btn primary" id="e-retry">RETRY <span class="ko">수습할 기회로 돌아가기</span></button><button class="btn" id="e-title">TITLE <span class="ko">타이틀로</span></button></div></div>`;
    el.querySelector('#e-title').onclick=toTitle;
    el.querySelector('#e-retry').onclick=async()=>{ try{ const s=await store.listSlots(); if(s[0]) loadRec(s[0]); else toast('자동 저장 기록이 없어요.'); }catch(err){ toast(err.message); } };
  }
  const CLEAR = {
    1:{ title:'첫 번째 밤을 살아남다', body:'원작의 첫 파멸을 지나 왔습니다.', next:'제2장 「성녀의 다과회」' },
    2:{ title:'성녀의 가면을 마주하다', body:'같은 세계에서 온 라이벌과 처음으로 맞붙었습니다.', next:'제3장 「사냥제와 약혼 발표」' },
    3:{ title:'원작의 기둥을 흔들다', body:'원작의 가장 예쁜 장면 앞에 서서, 무대 뒤의 또 다른 손을 보았습니다.', next:'제4장 「건국 기념 가면무도회」' },
    4:{ title:'가면 아래의 경전', body:'원작이 이 세계에 실재한다는 것을, 그리고 그 마지막 장이 바뀌었다는 것을 알았습니다.', next:'제5장 「대신관의 경전」' },
    5:{ title:'진실을 말하다', body:'책 속 세계의 진실과, 그 책을 경전으로 믿는 사람과 마주했습니다. 체험판은 여기까지예요.', next:'최종장 「건국제」 (제작 중)' },
  };
  function showDemoEnd(cmd={}){
    const S=Game.state, n=cmd.n||1, C=CLEAR[n]; autosave(`제${n}장 완료`);
    const th=Story.topHero(S), st=topStyle(S);
    const el=$('#end-card'); el.className='endcard'; el.hidden=false;
    el.innerHTML=`<div class="inner"><span class="k">CHAPTER ${n} CLEAR</span><h2>${esc(C.title)}</h2>
      <p>${esc(fill("{full|은}",S))} ${esc(C.body)}</p>
      <div class="sum"><div><b>${st?STYLES[st].label:'미정'}</b>나의 성향</div><div><b>${th?esc(CHARS[th].name):'—'}</b>가장 마음이 기운 상대</div>
      <div><b>${repLabel(S.rep)} (${S.rep})</b>사교계 평판</div><div><b>${rivalLabel(S.rival)} (${S.rival})</b>성녀의 경계</div></div>
      <p style="font-size:14px">다음 장 예고 · ${esc(C.next)}</p>
      <div class="row"><button class="btn primary" id="d-save">SAVE <span class="ko">기록 남기기</span></button><button class="btn" id="d-chars">CHARACTER <span class="ko">관계도</span></button><button class="btn" id="d-title">TITLE <span class="ko">타이틀로</span></button></div></div>`;
    el.querySelector('#d-save').onclick=()=>openSlots('save');
    el.querySelector('#d-chars').onclick=()=>openChars('map');
    el.querySelector('#d-title').onclick=toTitle;
  }

  /* ---------- boot ---------- */
  function bind(){
    $('#t-new').onclick=newGame; $('#t-continue').onclick=continueGame;
    $('#t-load').onclick=()=>{ Sound.unlock(); openSlots('load'); };
    $('#t-chars').onclick=()=>openChars('book'); $('#t-gallery').onclick=()=>openGallery('cg');
    $('#t-settings').onclick=openSettings; $('#t-account').onclick=()=>openAuth('login');
    $('#dialog').onclick=()=>Game.next();
    $('#hb-save').onclick=()=>openSlots('save'); $('#hb-load').onclick=()=>openSlots('load');
    $('#hb-log').onclick=openLog; $('#hb-auto').onclick=Game.toggleAuto; $('#hb-skip').onclick=Game.toggleSkip;
    $('#hb-chars').onclick=()=>openChars('map'); $('#hb-config').onclick=openSettings;
    $('#hb-title').onclick=()=>{ const p=openPanel(`<span class="eyebrow">TITLE</span><h2>타이틀로 돌아갈까요?</h2><p class="lead">지금 위치를 자동 저장한 뒤 타이틀로 돌아가요.</p><div class="row"><button class="btn primary" id="tt-y">돌아가기</button><button class="btn" id="tt-n">계속 플레이</button></div>`);
      p.querySelector('#tt-y').onclick=()=>{ autosave('타이틀로 나가기 전'); toTitle(); }; p.querySelector('#tt-n').onclick=closePanel; };
    $('#cgshow').onclick=()=>Game.next(); $('#chapcard').onclick=()=>Game.next();
    document.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ if(!$('#viewer').hidden) $('#viewer').hidden=true; else if(!$('#veil').hidden) closePanel(); return; }
      if(!$('#game').classList.contains('on') || !$('#veil').hidden || !$('#viewer').hidden) return;
      if((e.key===' '||e.key==='Enter') && !e.target.closest('button,input,select')){ e.preventDefault(); Game.next(); }
    });
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden && Game.state && Date.now()-lastAuto>20000) autosave('잠시 자리 비움'); });
    document.addEventListener('pointerdown', ()=>Sound.unlock(), { once:true });
  }
  async function boot(){
    applySettings();
    $('#title .scene').innerHTML = Art.bgSVG('title');
    $$('[data-orn]').forEach(e=>e.outerHTML=Art.ICON.orn());
    $$('#dialog .corner').forEach(c=>c.innerHTML=Art.ICON.corner());
    $('#next-ind').innerHTML = Art.ICON.next();
    bind(); startMotes(); screen('title');
    document.addEventListener('pointerdown', ()=>{ if($('#title').classList.contains('on')) Sound.play('ball'); }, { once:true });
    await initStore();
  }
  return { boot, settings, unlockCG, recordMet, recordClear:recordEnding, autosave, showEnding, showDemoEnd, toast, get records(){ return records; }, get store(){ return store; } };
})();

UI.boot();

</script></body></html>
