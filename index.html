<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e0d10"></head><body>
<title>Comma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile app column (max 720px) — per-tab header, scrolling content, fixed 4-tab bar. Single dark theme by design. */
:root{
  --bg:#0e0d10; --bg2:#151418; --card:#1c1a20; --card2:#26232b; --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --pink:#ff4f9a; --pink2:#ff7ab4; --rose:#f2a7c6; --glow:rgba(255,79,154,.32);
  --text:#f5f2f6; --text2:#b5aeb9; --text3:#7a7480; --ok:#6fdca5;
  --f-logo:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif;
  --f-head:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --r-lg:20px; --r-md:16px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --tabh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,.eban:focus-within,.eav:focus-within{outline:2px solid var(--pink);outline-offset:2px;border-radius:10px}
.hidden{display:none!important}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}

/* per-tab header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;min-height:60px;padding:8px 16px;background:rgba(14,13,16,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top h1{margin:0;font-family:var(--f-head);font-weight:800;font-size:23px;letter-spacing:-.02em}
.htabs{display:flex;gap:16px;align-items:baseline}
.htabs a{font-family:var(--f-head);font-weight:800;font-size:23px;letter-spacing:-.02em;color:var(--text3);transition:color .2s}
.htabs a.on{color:var(--text)}
.top .sp{flex:1}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .2s}
.iconbtn:hover{background:var(--card)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--bg)}
.searchbar{display:flex;align-items:center;gap:10px;margin:0 16px 8px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line2);color:var(--text3)}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.searchbar input::placeholder{color:var(--text3)}
.pad{padding:0 16px}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(16,15,19,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:11.5px;font-weight:500;transition:color .2s}
.tab .ico{width:25px;height:25px}
.tab.on{color:var(--text)}
.tab.on .ico{fill:currentColor;stroke:currentColor}
.tab .ico .pl{fill:none;stroke:currentColor}
.tab.on .ico .pl{stroke:var(--bg)}

/* notice carousel */
.notice{position:relative;margin:4px 16px 0}
.nrail{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-md)}
.nrail::-webkit-scrollbar{display:none}
.ncard .nmore{margin-left:auto;align-self:center;color:var(--text3);font-size:22px;line-height:1}
.ncard .nmore .ico{width:20px;height:20px}
button.ncard{width:100%;font:inherit;color:inherit;cursor:pointer}
.npost{color:var(--text2);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.ncard{scroll-snap-align:start;display:flex;align-items:center;gap:14px;min-height:104px;padding:18px 20px;border-radius:var(--r-md);background:var(--bg2);border:1px solid var(--line);text-align:left}
.ncard b{display:block;word-break:keep-all;font-family:var(--f-head);font-weight:800;font-size:18px;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.ncard small{display:block;word-break:keep-all;margin-top:3px;color:var(--text3);font-size:12.5px}
.ncard .em{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,79,154,.12);color:var(--pink)}
.ncount{position:absolute;right:12px;bottom:9px;padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.35);color:var(--text3);font-size:11.5px;font-variant-numeric:tabular-nums}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 17px;border-radius:99px;background:var(--card2);color:var(--text2);font-size:14.5px;font-weight:500;transition:all .2s var(--ease)}
.chip.on{background:var(--pink);color:#fff;box-shadow:0 6px 18px var(--glow)}
.sec{margin-top:22px}

/* character grid card */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r-md);overflow:hidden;background:var(--bg2);text-align:left;animation:rise .45s var(--ease) both}
.card .art{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:var(--card)}
.card .art svg,.card .art img{width:100%;height:100%;display:block;object-fit:cover}
.card .art::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(180deg,transparent,rgba(21,20,24,.95))}
.cnt{position:absolute;top:9px;left:9px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:99px;background:rgba(10,9,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cnt .ico{width:14px;height:14px;fill:currentColor;stroke:none}
.ori{position:absolute;top:9px;right:48px;z-index:2;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--pink);color:#fff;font:800 12px var(--f-logo)}
.fav{position:absolute;top:6px;right:6px;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,9,12,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;transition:transform .2s}
.fav .ico{width:18px;height:18px}
.fav.on{color:var(--pink)}.fav.on .ico{fill:var(--pink)}
.fav:active{transform:scale(.86)}
.card .info{position:relative;display:grid;gap:2px;margin-top:-34px;z-index:2;padding:0 12px 13px;min-width:0}
.card .nm{font-family:var(--f-head);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .one{color:var(--text);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.92}
.card .tg{color:var(--text3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pl{color:var(--pink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{display:grid;justify-items:center;gap:8px;margin:0 16px;padding:34px 18px;border-radius:var(--r-md);border:1px dashed var(--line2);color:var(--text3);text-align:center;font-size:14px}
.empty b{color:var(--text2);font-weight:600}
.lnk{color:var(--pink2);font-weight:600;font-size:14px}
.skel .art{background:linear-gradient(100deg,#1c1a20 30%,#27242c 50%,#1c1a20 70%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.sk{display:block;height:12px;border-radius:6px;background:#27242c;margin:5px 0}.sk.short{width:60%}
@keyframes shim{to{background-position:-200% 0}}
.offline{margin:8px 16px 0;padding:10px 14px;border-radius:12px;background:rgba(255,79,154,.08);border:1px solid rgba(255,79,154,.25);color:var(--rose);font-size:13px}

/* ranking list */
.rank{display:grid;gap:4px;padding:0 16px}
.rrow{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0}
.rno{font-family:var(--f-logo);font-weight:800;font-size:19px;text-align:center;color:var(--text3);font-variant-numeric:tabular-nums}
.rrow:nth-child(-n+3) .rno{color:var(--pink)}
.thumb{display:block;width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--card)}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.rtx{min-width:0;display:grid;gap:1px}
.rtx b{font-family:var(--f-head);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtx span{color:var(--text3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{display:grid;justify-items:end;color:var(--text2);font-size:12.5px;font-variant-numeric:tabular-nums}
.rmeta i{font-style:normal;color:var(--pink2)}

/* create tab list */
.sum{padding:16px 16px 6px}
.sum small{color:var(--text3);font-size:13.5px}
.sum b{display:block;font-family:var(--f-head);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mrow .acts{display:flex;gap:2px;color:var(--text2)}
.fab{position:fixed;z-index:35;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 18px);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#e2307f);color:#fff;box-shadow:0 10px 30px var(--glow);transition:transform .2s}
.fab:active{transform:scale(.94)}
.fab .ico{width:28px;height:28px}

/* chats tab */
.shelf-h{display:flex;align-items:center;gap:6px;padding:10px 16px 12px;font-family:var(--f-head);font-weight:700;font-size:16px}
.shelf-h .ico{width:18px;height:18px;color:var(--pink);fill:var(--pink)}
.shelf-h small{margin-left:auto;color:var(--text3);font:500 13px var(--f-body)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 16px 4px}
.shelf::-webkit-scrollbar{display:none}
.shelf a{display:grid;gap:6px;min-width:0}
.shelf .sq{display:block;width:96px;height:120px;border-radius:14px;overflow:hidden;background:var(--card)}
.shelf .sq svg,.shelf .sq img{width:100%;height:100%;display:block;object-fit:cover}
.shelf span{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-empty{margin:0 16px;padding:18px;border-radius:var(--r-md);background:var(--bg2);color:var(--text3);font-size:13.5px;text-align:center}
.divider{height:1px;margin:20px 0 0;background:var(--line)}
.sort{display:inline-flex;align-items:center;gap:4px;padding:14px 16px 6px;color:var(--text2);font-weight:500}
.sort .ico{width:18px;height:18px}

/* my page */
.pcard{margin:6px 16px 0;border-radius:var(--r-lg);overflow:hidden;background:var(--bg2)}
.banner{position:relative;display:block;aspect-ratio:3/1;background:var(--card);background-size:cover;background-position:center}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{position:relative;padding:0 20px 20px}
.prow{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:-42px}
.pav{flex:none;display:grid;place-items:center;overflow:hidden;width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#3a2232,#1c1520);border:4px solid var(--bg2);color:var(--rose);font-family:var(--f-head);font-weight:800;font-size:32px}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.pname{min-width:0}
.pname b{display:block;font-family:var(--f-head);font-weight:800;font-size:21px;letter-spacing:-.01em;overflow-wrap:anywhere}
.pname span{color:var(--text3);font-size:14px}
.pbio{margin:12px 0 0;color:var(--text2);white-space:pre-line;overflow-wrap:anywhere;font-size:14.5px}
.pbio.muted{color:var(--text3)}
.pnums{display:flex;gap:18px;margin-top:12px;font-size:14.5px;color:var(--text3)}
.pnums b{color:var(--text);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gbtn{height:46px;border-radius:12px;background:var(--card2);color:var(--text);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.gbtn:active{filter:brightness(1.15)}
.menu{margin:12px 16px 0;border-radius:var(--r-lg);background:var(--bg2);overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.mi:last-child{border-bottom:0}
.mi .ico{width:21px;height:21px;color:var(--text2)}
.mi em{margin-left:auto;font-style:normal;color:var(--text3);font-size:14px;font-variant-numeric:tabular-nums}
.foot{padding:34px 20px 10px;color:var(--text3);font-size:12.5px}
.foot .logo{font-size:24px;color:var(--text3)}
.logo{font-family:var(--f-logo);font-weight:800;font-size:22px;letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--pink)}
.guest{display:grid;justify-items:center;gap:12px;text-align:center;margin:6px 16px 0;padding:44px 22px;border-radius:var(--r-lg);background:linear-gradient(160deg,rgba(255,79,154,.12),rgba(255,79,154,.02) 60%),var(--bg2)}
.guest .orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,122,180,.5),rgba(255,79,154,.12) 60%,transparent 70%);color:var(--pink)}
.guest h2{margin:0;font-family:var(--f-head);font-weight:800;font-size:22px}
.guest p{margin:0;color:var(--text2);font-size:14.5px;max-width:32ch}
.row2{display:flex;gap:10px;width:100%}
.btn{flex:1;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--pink),#e2307f);color:#fff;box-shadow:0 8px 24px var(--glow);transition:transform .2s,filter .2s}
.btn:active{transform:scale(.98)}
.btn[aria-disabled="true"]{filter:saturate(.35) brightness(.8);box-shadow:none;cursor:not-allowed}
.btn.sec2{background:var(--card2);box-shadow:none;color:var(--text)}

/* profile edit */
.edit{display:grid;gap:18px;padding:6px 16px 0}
.eban{position:relative;display:block;aspect-ratio:3/1;border-radius:var(--r-md);overflow:hidden;cursor:pointer;background:var(--card)}
.eban img{width:100%;height:100%;object-fit:cover;display:block}
.eban .cam,.eav .cam{position:absolute;display:grid;place-items:center;border-radius:50%;background:rgba(10,9,12,.6);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.eban .cam{right:10px;bottom:10px;width:38px;height:38px}
.eav{position:relative;justify-self:start;margin-top:-56px;margin-left:14px;cursor:pointer}
.eav .pav{width:92px;height:92px}
.eav .cam{right:0;bottom:2px;width:32px;height:32px;background:var(--pink)}
.eav .cam .ico,.eban .cam .ico{width:17px;height:17px}
.minis{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:-6px}
.mini{color:var(--text3);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.fld{display:grid;gap:6px}
.fld>span{display:flex;justify-content:space-between;color:var(--text2);font-size:13.5px;font-weight:500}
.fld em{font-style:normal;color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums}
.fld input,.fld textarea{width:100%;min-height:50px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:16px;outline:0;resize:vertical;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld textarea:focus{border-color:rgba(255,79,154,.6);box-shadow:0 0 0 4px rgba(255,79,154,.12)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--text3)}
.at{position:relative}.at input{padding-left:32px}.at::before{content:"@";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
.hint{margin:0;color:var(--text3);font-size:12.5px}
.hint.err{color:#ffb3bf}
.savebtn{height:38px;padding:0 16px;border-radius:99px;background:var(--pink);color:#fff;font-weight:700;font-size:14px}
.savebtn[aria-disabled="true"]{opacity:.5}

/* detail */
.detail{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--bg);animation:slide .35s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.dbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto -60px;height:calc(60px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;transition:background .25s}
.dbar .iconbtn{color:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.dbar-t{flex:1;text-align:center;font-family:var(--f-head);font-weight:800;font-size:17px;opacity:0;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar.solid{background:rgba(14,13,16,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.dbar.solid .dbar-t{opacity:1}
.dbar.solid .iconbtn{filter:none}
.d-wrap{max-width:720px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.d-hero{position:relative;aspect-ratio:1/1;max-height:62vh;width:100%;overflow:hidden;background:var(--card)}
.d-hero>svg,.d-hero>img{width:100%;height:100%;display:block;object-fit:cover}
.d-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,13,16,.5) 0,transparent 22%,transparent 60%,var(--bg) 100%)}
.d-head{position:relative;z-index:2;margin-top:-40px;padding:0 20px}
.d-head h2{margin:0;font-family:var(--f-head);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.25;overflow-wrap:anywhere}
.d-head .tl{margin:8px 0 0;color:var(--text);font-size:16.5px;font-weight:600}
.dtags{margin:6px 0 0;color:var(--text3);font-size:15px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dchip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;background:var(--card2);color:var(--text2);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.dchip .ico{width:15px;height:15px}
.dchip.soft{background:rgba(255,79,154,.12);color:var(--rose)}
button.dchip{color:var(--text)}
.dsep{height:1px;margin:20px 20px 0;background:var(--line2)}
.byline{display:flex;align-items:center;gap:12px;padding:18px 20px 4px}
.bav{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--card2);color:var(--rose);font-weight:800;font-size:16px}
.bav img{width:100%;height:100%;object-fit:cover}
.bav.logo-b{background:var(--pink);color:#fff;font-family:var(--f-logo);font-size:20px}
.bl{display:grid;line-height:1.35}
.bl b{font-weight:700;font-size:15.5px}
.bl small{color:var(--text3);font-size:14px}
.ds{padding:26px 20px 0}

/* ============ mini markdown for 소개글 (escaped first, https images only) ============ */
/* {{user}} / {{char}} become real names, with the Korean particle that fits the name's last syllable */
let NAMES = null;
const hasBatchim = w => { const ch = (w || '').trim().slice(-1), k = ch.charCodeAt(0) - 0xAC00; return k >= 0 && k <= 11171 && k % 28 !== 0; };
const hasRieul = w => { const ch = (w || '').trim().slice(-1), k = ch.charCodeAt(0) - 0xAC00; return k >= 0 && k <= 11171 && k % 28 === 8; };
const PARTICLES = { '이에요': ['이에요', '예요'], '예요': ['이에요', '예요'], '이야': ['이야', '야'], '이랑': ['이랑', '랑'], '랑': ['이랑', '랑'], '으로': ['으로', '로'], '로': ['으로', '로'], '이': ['이', '가'], '가': ['이', '가'], '은': ['은', '는'], '는': ['은', '는'], '을': ['을', '를'], '를': ['을', '를'], '과': ['과', '와'], '와': ['과', '와'], '아': ['아', '야'] };
function subNames(src, over) {
  const n = Object.assign({ user: (S.profile && S.profile.nickname) || '당신', char: '' }, NAMES || {}, over || {});
  return String(src || '').replace(/\{\{\s*(user|char)\s*\}\}(이에요|예요|이야|이랑|랑|으로|로|이|가|은|는|을|를|과|와|아)?/gi, (_, who, pt) => {
    const name = n[who.toLowerCase()] || (who.toLowerCase() === 'user' ? '당신' : '캐릭터');
    if (!pt) return name;
    const [withB, without] = PARTICLES[pt];
    if ((pt === '으로' || pt === '로') && hasRieul(name)) return name + '로';
    return name + (hasBatchim(name) ? withB : without);
  });
}
/* shared inline marks: **bold**, *soft (actions, thoughts)*, ~strike~, ≈text message≈, ==highlight== */
function marks(h) {
  return h.replace(/≈([^≈]+?)≈/g, (_, t) => `<span class="sms">${t.trim()}</span>`)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^0-9])~(?![\s~])([^~\n]+?)(?<!\s)~(?![0-9])/g, '$1<s>$2</s>')
    .replace(/==(.+?)==/g, '<mark>$1</mark>')
    .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<i>$2</i>');
}
function inlineMd(src, over) {
  return marks(esc(subNames(src, over))).replace(/\n/g, '<br>');
}
function miniMd(src, over) {
  const out = []; let list = false;
  for (const raw0 of esc(subNames(src, over)).split('\n')) {
    const raw = raw0.trim();
    let l = marks(raw).replace(/!\[([^\]]*)\]\((https:\/\/[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
    if (/^[-•·]\s+/.test(raw)) { if (!list) { out.push('<ul>'); list = true; } out.push(`<li>${l.replace(/^[-•·]\s+/, '')}</li>`); continue; }
    if (list) { out.push('</ul>'); list = false; }
    if (/^(-{3,}|_{3,}|—{2,}|─{3,})$/.test(raw)) out.push('<hr>');
    else if (/^###?\s+/.test(raw)) out.push(`<h5>${l.replace(/^###?\s+/, '')}</h5>`);
    else if (/^#\s+/.test(raw)) out.push(`<h4>${l.replace(/^#\s+/, '')}</h4>`);
    else if (/^&gt;\s?/.test(raw)) out.push(`<blockquote>${l.replace(/^&gt;\s?/, '')}</blockquote>`);
    else if (!raw) out.push('<div class="gap"></div>');
    else out.push(`<p>${l}</p>`);
  }
  if (list) out.push('</ul>');
  return out.join('');
}

/* ============ generated art for user characters without images ============ */
function autoArt(seed) {
  let h = 0; for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const pick = a => a[(h = (h * 1103515245 + 12345) >>> 0) % a.length];
  const bgs = [['#ff8fb8', '#3b1730'], ['#c9b6ff', '#1c1636'], ['#7d8bb5', '#11131c'], ['#ffb37a', '#24140c'], ['#5fe0ff', '#0a1624'], ['#d4424e', '#14080c'], ['#9be3b0', '#0f1f17']];
  const g = pick(['f', 'm']);
  return { bg: pick(bgs), hair: pick(['#2a2038', '#3a2522', '#e8e2ea', '#6a4028', '#1e1d24', '#c9d6ff', '#a0522d']), hairStyle: g === 'f' ? pick(['long', 'bob', 'wavy', 'twin']) : pick(['short', 'short2', 'messy']), eye: pick(['#7a4a3a', '#8fb8ff', '#ff4f9a', '#ffcf4a', '#4ff0ff', '#6a4028']), skin: pick(['#ffe1d4', '#fff0ea', '#f3d9c8', '#ffe0cc']), cloth: pick(['#f4ede6', '#2a2a34', '#1f2b4f', '#3a2a5a', '#ffffff']), collar: pick(['#c9a68a', '#ff7ab4', '#ece6dc', '#4ff0ff']), acc: '', face: pick(['smile', 'soft', 'cool', 'grin', 'open']), gender: g };
}

async function sendChat(text, regen, editId) {
  if (C.sending) return;
  C.sending = true; C.err = ''; C.streamText = ''; C.regenId = null;
  const last = C.msgs[C.msgs.length - 1];
  if (editId) { const ix = C.msgs.findIndex(m => m.id === editId); if (ix >= 0) { C.msgs = C.msgs.slice(0, ix + 1); C.msgs[ix].content = text; } C.editId = null; }
  else if (!regen) { C.msgs.push({ id: 'tmp', role: 'user', content: text }); window.__chatDraft = ''; }
  else if (last && last.role === 'assistant') C.regenId = last.id;
  renderChat();
  const id = C.id;
  try {
    C.abort = new AbortController();
    const body = editId ? { action: 'edit', conversation_id: id, message_id: editId, text } : regen ? { action: 'regenerate', conversation_id: id } : { action: 'send', conversation_id: id, text };
    const r = await chatFetch(body, C.abort.signal);
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      if (!regen && !editId && r.status !== 502) { C.msgs.pop(); window.__chatDraft = text; }
      throw new Error(j.error || '답장을 받지 못했어요');
    }
    if ((r.headers.get('content-type') || '').includes('application/json')) { const j = await r.json(); if (j.blocked) throw Object.assign(new Error('blocked'), { blocked: true }); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.user_id) { const t = C.msgs.find(m => m.id === 'tmp'); if (t) t.id = ev.user_id; }
        if (ev.d) { C.streamText += ev.d; if (C.id === id) { const el = $('#streaming p'); if (el) { el.innerHTML = inlineMd(C.streamText); if (!C.regenId) window.scrollTo(0, document.body.scrollHeight); } } }
        if (ev.blocked) throw Object.assign(new Error('blocked'), { blocked: true });
        if (ev.error) throw new Error(ev.error);
        if (ev.done) {
          const content = C.streamText.trim();
          const ex = C.msgs.find(m => m.id === ev.assistant_id);
          if (ex) Object.assign(ex, { content, alts: ev.alts, alt_idx: ev.alt_idx });
          else C.msgs.push({ id: ev.assistant_id, role: 'assistant', content, alts: ev.alts || [content], alt_idx: ev.alt_idx || 0 });
        }
      }
    }
  } catch (e) {
    if (e.blocked) {
      /* refused: the turn is gone on the server too; give the text back to the input */
      if (editId) { await reloadMsgs(id); C.editId = editId; window.__editDraft = text; }
      else if (!regen) { const lm = C.msgs[C.msgs.length - 1]; if (lm && lm.role === 'user' && (lm.id === 'tmp' || lm.content === text)) C.msgs.pop(); window.__chatDraft = text; }
      flashBanner('부적절한 내용이라 대화를 이어갈 수 없어요. 다른 표현으로 다시 시도해 주세요.');
    } else if (e.name !== 'AbortError') {
      C.err = /load failed|failed to fetch|network/i.test(e.message || '') ? '연결이 끊겼어요. 다시 시도해 주세요.' : (e.message || '답장을 받지 못했어요');
      await reloadMsgs(id);
    }
  }
  C.sending = false; C.streamText = ''; C.abort = null; C.regenId = null;
  if (C.id === id && curHash() === 'chat-' + id) renderChat(false);
  loadConvs();
}

function escLike(q) { return q.replace(/[%_\\,()]/g, m => '\\' + m); }
async function findUsers(q) {
  const t = q.trim().replace(/^@/, ''); if (!t || !sb) return [];
  const pat = `%${escLike(t)}%`;
  const [a, b] = await Promise.all([
    sb.from('profiles').select('id,nickname,handle,avatar_url,follower_count').ilike('nickname', pat).limit(20),
    sb.from('profiles').select('id,nickname,handle,avatar_url,follower_count').ilike('handle', pat.toLowerCase()).limit(20),
  ]);
  const map = new Map();
  for (const r of [...(a.data || []), ...(b.data || [])]) map.set(r.id, r);
  return [...map.values()].sort((x, y) => (y.follower_count || 0) - (x.follower_count || 0));
}
function tagStats(q) {
  const t = q.trim().replace(/^#/, '').toLowerCase(); if (!t) return [];
  const count = new Map();
  for (const c of CHARS) for (const g of c.tags) if (g.toLowerCase().includes(t)) count.set(g, (count.get(g) || 0) + 1);
  return [...count.entries()].sort((a, b) => (b[0].toLowerCase() === t) - (a[0].toLowerCase() === t) || b[1] - a[1]).slice(0, 8);
}
function charResults(q) {

  if (!k) return [];

/* Cropper: the person drags/pinches the photo inside a pink frame (round for profile pictures), then we draw exactly that frame */
function encodeCanvas(cv) {

function cropImage(file, w, h, opts = {}) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.onload = () => {
      const ov = document.createElement('div'); ov.className = 'crop'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', '이미지 자르기');
      ov.innerHTML = `<div class="crop-top"><button class="iconbtn" data-c="x" aria-label="취소">${I.close}</button><b>이미지 자르기</b><button class="crop-ok" data-c="ok">완료</button></div>
        <p class="crop-hint">${esc(opts.hint || (opts.round ? '프로필 이미지로 들어갈 영역을 지정해 주세요' : '보여 줄 영역을 지정해 주세요'))}</p>
        <div class="crop-stage"><img alt="" draggable="false"><div class="crop-frame${opts.round ? ' round' : ''}"></div></div>
        <div class="crop-zoom"><span>−</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="확대"><span>+</span></div>`;
      document.body.append(ov); document.body.classList.add('sheet-open');
      const st = ov.querySelector('.crop-stage'), im = st.querySelector('img'), fr = st.querySelector('.crop-frame'), zr = ov.querySelector('input');
      im.src = url;
      let F = {}, base = 1, z = 1, x = 0, y = 0;
      const layout = () => {
        const W = st.clientWidth, H = st.clientHeight, pad = 20, r = w / h;
        let fw = W - pad * 2, fh = fw / r; if (fh > H - pad * 2) { fh = H - pad * 2; fw = fh * r; }
        F = { l: (W - fw) / 2, t: (H - fh) / 2, w: fw, h: fh };
        Object.assign(fr.style, { left: F.l + 'px', top: F.t + 'px', width: fw + 'px', height: fh + 'px' });
        base = Math.max(fw / img.width, fh / img.height);
      };
      const clamp = () => {
        const s = base * z, iw = img.width * s, ih = img.height * s;
        x = Math.min(F.l, Math.max(F.l + F.w - iw, x)); y = Math.min(F.t, Math.max(F.t + F.h - ih, y));
        im.style.transform = `translate(${x}px,${y}px) scale(${s})`;

      const zoomAt = (nz, cx, cy) => { nz = Math.min(4, Math.max(1, nz)); const k = nz / z; x = cx - (cx - x) * k; y = cy - (cy - y) * k; z = nz; zr.value = z; clamp(); };
      layout(); x = F.l + (F.w - img.width * base) / 2; y = F.t + (F.h - img.height * base) / 2; clamp();
      const onResize = () => { const cx = F.l + F.w / 2, cy = F.t + F.h / 2, rx = (cx - x) / (base * z), ry = (cy - y) / (base * z); layout(); x = F.l + F.w / 2 - rx * base * z; y = F.t + F.h / 2 - ry * base * z; clamp(); };
      addEventListener('resize', onResize);
      const pts = new Map(); let last = null;
      const mid = () => { const a = [...pts.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) }; };
      const rel = e => { const r = st.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      st.addEventListener('pointerdown', e => { st.setPointerCapture(e.pointerId); pts.set(e.pointerId, rel(e)); last = pts.size === 2 ? mid() : rel(e); });

async function loadUnread() {
  if (!S.user || !sb) { S.unread = 0; return; }
  const { count, error } = await sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', S.user.id).is('read_at', null);
  if (error) return;
  const changed = count !== S.unread; S.unread = count || 0;
  if (changed && ['home', 'rank'].includes(curHash() || 'home')) $('#top').innerHTML = headerHome(curHash() === 'rank');
}
async function loadNoti() {
  const { data, error } = await sb.from('notifications').select('id,kind,title,body,link,read_at,created_at').eq('user_id', S.user.id).order('created_at', { ascending: false }).limit(50);
  S.noti = error ? [] : data;
}
async function markAllRead(fromButton) {
  if (!S.user) return;

  const { error } = await sb.from('notifications').update({ read_at: now }).eq('user_id', S.user.id).is('read_at', null);
  if (!error) { S.unread = 0; if (fromButton) { (S.noti || []).forEach(n => { if (!n.read_at) n.read_at = now; }); renderNoti(); toast('모두 읽음으로 표시했어요'); } }
}
function ago(t) {
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 604800) return Math.floor(s / 86400) + '일 전'; return new Date(t).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
}

let lastBase = 'home';
function route() {
  const h = curHash();

  if (h.startsWith('chat-')) { $('#detail').innerHTML = ''; document.body.style.overflow = ''; document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === 'chats')); openChat(h.slice(5)); return; }
  document.body.classList.remove('chatting');
  if (E.data) { E.data = null; }
  document.body.classList.remove('editing');
  const isDetail = h.startsWith('c-');
  if (h.startsWith('u-')) { $('#detail').innerHTML = ''; document.body.style.overflow = ''; document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('on')); window.scrollTo(0, 0); lastBase = 'user'; openUser(h.slice(2)); return; }
  const base = isDetail ? lastBase : (['home', 'rank', 'create', 'chats', 'me', 'edit', 'reset', 'noti', 'search', 'support'].includes(h) ? h : 'home');
  const tab = { home: 'home', rank: 'home', create: 'create', chats: 'chats', me: 'me', edit: 'me', reset: 'me', noti: 'home', search: 'home', support: 'support', user: '' }[base];
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === tab));
  document.body.style.overflow = isDetail ? 'hidden' : '';
  if (isDetail) { if (!$('#view').children.length) renderBase(base); renderDetail(h.slice(2)); return; }
  $('#detail').innerHTML = '';
  if (base !== lastBase) window.scrollTo(0, 0);
  if (base === 'edit' && lastBase !== 'edit') resetPE();
  lastBase = base; if (base === 'noti') { renderNoti(true); return; } renderBase(base);
}
function renderBase(b) { ({ home: renderHome, rank: renderRank, create: renderCreate, chats: renderChats, me: renderMe, edit: renderEdit, reset: renderReset, noti: renderNoti, user: renderUser, search: renderSearch, support: renderSupport })[b](); }
function rerender() {
  const h = curHash();

  if (h.startsWith('chat-')) { if (!C.char || C.id !== h.slice(5)) route(); return; }
  if (h.startsWith('c-')) { renderBase(lastBase); renderDetail(h.slice(2)); return; }
  if (h.startsWith('u-')) { renderUser(); return; }
  if (h === 'edit' && document.activeElement && document.activeElement.closest && document.activeElement.closest('#editForm')) {
    /* keep typed text: only refresh the images */
    const f = $('#editForm'); const keep = { nickname: f.nickname.value, handle: f.handle.value, bio: f.bio.value }; renderEdit(); const g = $('#editForm'); for (const k in keep) g[k].value = keep[k]; return;
  }
  if (h === 'edit') { const f = $('#editForm'); const keep = f && { nickname: f.nickname.value, handle: f.handle.value, bio: f.bio.value }; renderEdit(); const g = $('#editForm'); if (keep && g) for (const k in keep) g[k].value = keep[k]; return; }

}

  if ((m = t.closest('[data-tmpedit]'))) { tmpEditOfficial(m.dataset.tmpedit); return; }
  if (t.closest('[data-tmpsave]')) { tmpSaveOfficial(t.closest('[data-tmpsave]').dataset.tmpsave); return; }
  if ((m = t.closest('[data-tmpimg]'))) { const id = m.dataset.tmpimg; closeSheet(); const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.onchange = () => tmpReplaceOfficialImage(id, inp.files[0]); inp.click(); return; }
  if (t.closest('[data-back]')) { location.hash = lastBase === 'user' && U.id ? '#u-' + U.id : '#' + lastBase; return; }
  if (t.closest('[data-share]') || t.closest('[data-shareprof]')) {
    const u = t.closest('[data-shareprof]') ? `${location.origin}${location.pathname}#me` : location.href;
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('링크를 복사했어요'), () => toast(u)); return;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'authForm') { e.preventDefault(); submitAuth(e.target); } });
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#sheet').innerHTML) closeSheet(); else if (curHash().startsWith('c-')) location.hash = lastBase === 'user' && U.id ? '#u-' + U.id : '#' + lastBase; } });
setInterval(() => { const r = $('#nrail'); if (!r || document.hidden || curHash() !== 'home') return; S.notice = (S.notice + 1) % NOTICES.length; r.scrollTo({ left: S.notice * r.clientWidth, behavior: 'smooth' }); }, 5000);

const charsReady = loadCharacters().then(list => { if (list.length) CHARS = list; }).catch(() => { S.offline = true; }).finally(() => { S.loading = false; rerender(); });
if (sb) {
  sb.auth.onAuthStateChange((ev, session) => {
    setTimeout(async () => { await charsReady; await onSession(session); if (ev === 'PASSWORD_RECOVERY') location.hash = '#reset'; }, 0);
  });
} else { S.authReady = true; }
route();
</script>
